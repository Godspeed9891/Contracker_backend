function canEditJob(c){ return (isStaff() && FEN_BOL_DEPTS.includes(state.department) && c.terminalId===state.terminalId); }
function canDeleteJob(c){ return (isTerminalAdmin() && c.terminalId===state.terminalId); }

/* ========================= EDIT / DELETE A JOB ========================= */
function jobEsc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function jobActionButtons(c){
  let h = '';
  if(canEditJob(c)) h += `<button class="btn small secondary" onclick="openEditJob('${c.id}')">✎ Edit job</button>`;
  if(canDeleteJob(c)) h += `<button class="btn small secondary" onclick="confirmArchiveJob('${c.id}')">🗄 Archive job</button>`;
  if(canDeleteJob(c) && isUntouchedJob(c)) h += `<button class="btn small danger" onclick="confirmDeleteJob('${c.id}')">🗑 Delete job</button>`;
  return h;
}
function showModalHTML(html){
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-bg').classList.add('open');
}
const EDIT_FIELDS = [
  ['containerNumber','Container number'], ['billOfLading','Bill of Lading'], ['size','Container size'],
  ['item','Cargo description'], ['destination','Destination']
];
function openEditJob(id, draft){
  const c = byId(id); if(!c) return;
  if(!canEditJob(c)){ toast('You do not have permission to edit this job.'); return; }
  if(checkMasterHold()) return;
  state.editingJob = id; state.openContainerId = id;
  const v = draft || {containerNumber:c.containerNumber, billOfLading:c.billOfLading, size:c.size, item:c.item, destination:c.destination};
  showModalHTML(`
    <div class="modal-head"><div><div class="tag-line">Edit job information</div><h2 class="mono" style="font-size:20px;">${jobEsc(c.containerNumber)}</h2></div>
      <button class="btn ghost" onclick="cancelEditJob('${id}')">✕</button></div>
    <div class="modal-body">
      <p class="tag-line" style="margin-bottom:12px;">Use this to correct a mistake such as a wrongly typed container number. You will be asked to confirm before anything is saved.</p>
      <form onsubmit="reviewEditJob(event,'${id}')">
        <div class="field"><label>Container number *</label><input id="ej-cnum" value="${jobEsc(v.containerNumber)}" required></div>
        <div class="field"><label>Bill of Lading *</label><input id="ej-bol" value="${jobEsc(v.billOfLading)}" required></div>
        <div class="field"><label>Container size *</label><select id="ej-size"><option value="20ft" ${v.size==='20ft'?'selected':''}>20ft</option><option value="40ft" ${v.size==='40ft'?'selected':''}>40ft</option></select></div>
        <div class="field"><label>Cargo description</label><input id="ej-item" value="${jobEsc(v.item)}"></div>
        <div class="field"><label>Destination</label><input id="ej-dest" value="${jobEsc(v.destination)}"></div>
        <div style="display:flex;gap:8px;margin-top:14px;"><button class="btn" type="submit">Review changes</button>
          <button class="btn secondary" type="button" onclick="cancelEditJob('${id}')">Cancel</button></div>
      </form>
    </div>`);
}
function cancelEditJob(id){ state.editingJob = null; if(byId(id)) openContainer(id); else closeModal(); }
function readEditDraft(){
  return { containerNumber:document.getElementById('ej-cnum').value.trim().toUpperCase(), billOfLading:document.getElementById('ej-bol').value.trim(),
    size:document.getElementById('ej-size').value, item:document.getElementById('ej-item').value.trim() || 'Unspecified cargo',
    destination:document.getElementById('ej-dest').value.trim() || 'Not specified' };
}
function reviewEditJob(e, id){
  e.preventDefault();
  const c = byId(id); if(!c){ toast('This job no longer exists.'); closeModal(); return; }
  const d = readEditDraft();
  if(!d.containerNumber || !d.billOfLading){ toast('Container number and Bill of Lading are required.'); return; }
  if(state.containers.some(x=>x.id!==id && x.containerNumber===d.containerNumber && x.terminalId===c.terminalId)){ toast('Another job already uses container number ' + d.containerNumber + '.'); return; }
  const changes = EDIT_FIELDS.filter(([k])=>String(c[k]==null?'':c[k])!==String(d[k]));
  if(!changes.length){ toast('Nothing was changed.'); return; }
  state.editDraft = d;
  showModalHTML(`
    <div class="modal-head"><div><div class="tag-line">Confirm changes</div><h2 style="font-size:20px;">Save these changes to ${jobEsc(c.containerNumber)}?</h2></div></div>
    <div class="modal-body">
      <div class="panel" style="margin-bottom:14px;"><div class="panel-body">${changes.map(([k,label])=>`<div class="kv" style="padding:6px 0;"><b>${label}</b><span><s style="opacity:.6">${jobEsc(c[k])}</s> &nbsp;→&nbsp; <strong>${jobEsc(d[k])}</strong></span></div>`).join('')}</div></div>
      <div style="display:flex;gap:8px;"><button class="btn" onclick="confirmEditJob('${id}')">Yes, save changes</button>
        <button class="btn secondary" onclick="openEditJob('${id}', state.editDraft)">Go back</button></div>
    </div>`);
}
async function confirmEditJob(id){
  const c = byId(id); const d = state.editDraft;
  if(!c || !d){ toast('This job no longer exists.'); closeModal(); return; }
  if(checkMasterHold()) return;
  const before = JSON.parse(JSON.stringify(c));
  const oldNum = c.containerNumber;
  const changed = EDIT_FIELDS.filter(([k])=>String(c[k]==null?'':c[k])!==String(d[k])).map(([k,label])=>label.toLowerCase());
  state.editingJob = null;
  EDIT_FIELDS.forEach(([k])=>{ c[k] = d[k]; });
  computeDuplicateFlags();
  const ok = await saveContainers(state.containers);
  if(!ok){
    const cur = byId(id); if(cur) Object.assign(cur, before);
    computeDuplicateFlags();
    if(byId(id)) openContainer(id); else closeModal();
    return;
  }
  await pushLog(`Job details corrected on ${oldNum}${oldNum!==d.containerNumber?' (now '+d.containerNumber+')':''}: ${changed.join(', ')} — by ${state.person}.`, 'Admin');
  toast('Job information updated.');
  openContainer(id);
}
function confirmDeleteJob(id){
  const c = byId(id); if(!c) return;
  if(!canDeleteJob(c)){ toast('You do not have permission to delete this job.'); return; }
  if(!isUntouchedJob(c)){ toast('This job has work recorded on it, so it cannot be deleted. Use Archive job instead.'); return; }
  if(checkMasterHold()) return;
  state.openContainerId = id;
  showModalHTML(`
    <div class="modal-head"><div><div class="tag-line" style="color:var(--rust);">Delete job</div><h2 class="mono" style="font-size:20px;">${jobEsc(c.containerNumber)}</h2></div>
      <button class="btn ghost" onclick="openContainer('${id}')">✕</button></div>
    <div class="modal-body">
      <p style="font-size:14px;margin-bottom:8px;"><b>Delete this job permanently?</b></p>
      <p class="tag-line" style="margin-bottom:6px;">${jobEsc(c.billOfLading)} · ${jobEsc(c.size)} · ${jobEsc(c.item)}</p>
      <p style="font-size:13px;margin-bottom:14px;">No work has been recorded on this job yet, so only the registration itself is lost. This cannot be undone. If you only mistyped something, use <b>Edit job</b>; if you may want it back later, use <b>Archive job</b> instead.</p>
      <div style="display:flex;gap:8px;"><button class="btn danger" onclick="deleteJob('${id}')">Yes, delete this job</button>
        <button class="btn secondary" onclick="openContainer('${id}')">No, keep it</button></div>
    </div>`);
}
async function deleteJob(id){
  const idx = state.containers.findIndex(x=>x.id===id);
  if(idx<0){ toast('This job was already removed.'); closeModal(); renderApp(); return; }
  const c = state.containers[idx];
  if(!canDeleteJob(c)){ toast('You do not have permission to delete this job.'); return; }
  if(!isUntouchedJob(c)){ toast('This job has work recorded on it, so it cannot be deleted. Use Archive job instead.'); return; }
  if(checkMasterHold()) return;
  const backup = state.containers.slice();
  state.containers = backup.filter(x=>x.id!==id);
  computeDuplicateFlags();
  const ok = await saveContainers(state.containers, {deleted:[id]});
  if(!ok){
    state.containers = backup;
    computeDuplicateFlags();
    closeModal(); renderApp();
    return;
  }
  await pushLog(`Job deleted: ${c.containerNumber} (${c.billOfLading}) — by ${state.person}.`, 'Admin');
  toast(`Job ${c.containerNumber} deleted.`);
  closeModal(); renderApp();
}

function isUntouchedJob(c){
  const blank = v => v===undefined || v===null || v===0 || v===false || v==='' || (Array.isArray(v)&&v.length===0) || (typeof v==='object' && !Array.isArray(v) && Object.values(v).every(blank));
  if((c.stageIdx||0)!==0) return false;
  for(const k of ['documents','alerts','invoices','transportHistory','progressNotes','transporter','transferLetterNumber','invoiceNumber','exitNumber','aNumber','cNumber']) if(!blank(c[k])) return false;
  if(c.bolComplete) return false;
  if(Array.isArray(c.history) && c.history.length>1) return false;
  const f = Object.assign({}, c.financial||{}); delete f.processingCharge; delete f.dutyStatus;
  return Object.values(f).every(blank);
}
function jobStatusLine(c){ return (c.archived? 'Archived by '+jobEsc(c.archived.by)+' on '+fmtDate(c.archived.date)+(c.archived.reason?' — '+jobEsc(c.archived.reason):'') : ''); }
function confirmArchiveJob(id){
  const c = byId(id); if(!c) return;
  if(!canDeleteJob(c)){ toast('You do not have permission to archive this job.'); return; }
  if(checkMasterHold()) return;
  state.openContainerId = id; state.editingJob = id;
  showModalHTML(`
    <div class="modal-head"><div><div class="tag-line">Archive job</div><h2 class="mono" style="font-size:20px;">${jobEsc(c.containerNumber)}</h2></div>
      <button class="btn ghost" onclick="cancelEditJob('${id}')">✕</button></div>
    <div class="modal-body">
      <p style="font-size:14px;margin-bottom:8px;"><b>Archive this job?</b></p>
      <p style="font-size:13px;margin-bottom:10px;">It disappears from every list and nobody can work on it, but nothing is lost: its history, documents, charges and alerts are kept, and an Admin can restore it at any time from the First Entry Note page.</p>
      <div class="field"><label>Reason (optional)</label><input id="aj-reason" placeholder="e.g. Registered by mistake / told not to proceed"></div>
      <div style="display:flex;gap:8px;margin-top:12px;"><button class="btn" onclick="archiveJob('${id}')">Yes, archive this job</button>
        <button class="btn secondary" onclick="cancelEditJob('${id}')">No, keep it active</button></div>
    </div>`);
}
async function archiveJob(id){
  const idx = state.containers.findIndex(x=>x.id===id);
  const c = state.containers[idx];
  if(!c){ toast('This job no longer exists.'); closeModal(); renderApp(); return; }
  if(!canDeleteJob(c)){ toast('You do not have permission to archive this job.'); return; }
  if(checkMasterHold()) return;
  const reasonEl = document.getElementById('aj-reason');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  const backup = state.containers.slice(), backupArch = (state.archived||[]).slice();
  state.editingJob = null;
  c.archived = { by: state.person, date: new Date().toISOString(), reason: reason };
  state.containers = backup.filter(x=>x.id!==id);
  state.archived = backupArch.concat([c]);
  computeDuplicateFlags();
  const ok = await saveContainers(state.containers);
  if(!ok){
    c.archived = null; state.containers = backup; state.archived = backupArch;
    computeDuplicateFlags();
    closeModal(); renderApp(); return;
  }
  await pushLog(`Job archived: ${c.containerNumber} (${c.billOfLading}) — by ${state.person}${reason?'. Reason: '+reason:''}.`, 'Admin');
  toast(`Job ${c.containerNumber} archived. It can be restored from the First Entry Note page.`);
  closeModal(); renderApp();
}
async function restoreJob(id){
  const arch = state.archived||[];
  const c = arch.find(x=>x.id===id); if(!c) return;
  if(!canDeleteJob(c)){ toast('You do not have permission to restore this job.'); return; }
  if(checkMasterHold()) return;
  if(state.containers.some(x=>x.containerNumber===c.containerNumber && x.terminalId===c.terminalId)){ toast('Another active job already uses container number '+c.containerNumber+'. Edit that one first.'); return; }
  const backup = state.containers.slice(), backupArch = arch.slice(), old = c.archived;
  c.archived = null;
  state.archived = arch.filter(x=>x.id!==id);
  state.containers = backup.concat([c]);
  computeDuplicateFlags();
  const ok = await saveContainers(state.containers);
  if(!ok){ c.archived = old; state.containers = backup; state.archived = backupArch; computeDuplicateFlags(); renderApp(); return; }
  await pushLog(`Job restored from archive: ${c.containerNumber} — by ${state.person}.`, 'Admin');
  toast(`Job ${c.containerNumber} restored.`);
  renderApp();
}
function archivedPanelHTML(){
  if(!(isSCTL()||isTerminalAdmin())) return '';
  const list = (state.archived||[]).filter(c=>(isSCTL()||c.terminalId===state.terminalId)).sort((a,b)=> new Date((b.archived||{}).date||0)-new Date((a.archived||{}).date||0));
  return `<div class="panel" style="margin-top:16px;"><div class="panel-head"><h3>Archived jobs (${list.length})</h3></div>
    <div class="panel-body" style="padding:0 18px;">${list.length? list.map(c=>`<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line,#e3e6dc);">
      <div><div class="mono"><b>${jobEsc(c.containerNumber)}</b> <span class="tag-line">${jobEsc(c.billOfLading)} · ${jobEsc(c.item)}</span></div><div class="tag-line">${jobStatusLine(c)}</div></div>
      <button class="btn small secondary" onclick="restoreJob('${c.id}')">Restore</button></div>`).join('') : '<div class="tag-line" style="padding:14px 0;">No archived jobs.</div>'}</div></div>`;
}
/* ---- Stored files; rejecting a document; staff uploading on someone's behalf; re-uploading ---- */
const FILE_EXTS = ['pdf','png','jpg','jpeg','webp','doc','docx','xls','xlsx','csv','txt'];
const FILE_MAX_MB = 10;
function docEsc(s){ return String(s==null?'':s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function fileExt(n){ const m = /\.([A-Za-z0-9]+)$/.exec(n||''); return m ? m[1].toLowerCase() : ''; }
function checkPickedFile(file){
  if(!file) return 'Choose a file first.';
  if(!FILE_EXTS.includes(fileExt(file.name))) return 'That file type is not allowed. Use a PDF, an image (PNG, JPG, WEBP), Word, Excel, CSV or text file.';
  if(file.size===0) return 'That file is empty.';
  if(file.size > FILE_MAX_MB*1024*1024) return 'That file is larger than '+FILE_MAX_MB+' MB.';
  return null;
}
async function uploadFileToServer(file){
  busyBegin('Uploading file…');
  try{ return await uploadFileToServerInner(file); } finally { busyEnd(); }
}
async function uploadFileToServerInner(file){
  const base = getApiBase();
  if(!base){ throw new Error('No server configured yet.'); }
  let res;
  try{
    res = await fetch(base+'/api/files?name='+encodeURIComponent(file.name), {method:'POST', headers:{'Content-Type':'application/octet-stream','Authorization':'Bearer '+getAuthToken()}, body:file});
  }catch(e){ const err = new Error('Could not reach the server, so the file was not uploaded. Check your connection and try again.'); err.code='NETWORK'; throw err; }
  let body = null; try{ body = await res.json(); }catch(e){}
  if(res.status===401){ setAuthToken(''); }
  if(!res.ok){ const err = new Error((body && body.error) || ('The upload failed (HTTP '+res.status+').')); err.status = res.status; throw err; }
  return body;
}
async function fetchStoredFile(fileId){
  busyBegin('Opening file…');
  try{ return await fetchStoredFileInner(fileId); } finally { busyEnd(); }
}
async function fetchStoredFileInner(fileId){
  const base = getApiBase();
  let res;
  try{ res = await fetch(base+'/api/files/'+encodeURIComponent(fileId), {headers:{'Authorization':'Bearer '+getAuthToken()}}); }
  catch(e){ throw new Error('Could not reach the server, so the file could not be opened. Check your connection and try again.'); }
  if(!res.ok){
    let body = null; try{ body = await res.json(); }catch(e){}
    throw new Error((body && body.error) || ('The file could not be opened (HTTP '+res.status+').'));
  }
  return await res.blob();
}
async function downloadStoredFile(fileId, name){
  try{
    const blob = await fetchStoredFile(fileId);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name || 'document'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ showErrorBanner('Could not download', e.message); }
}
async function viewStoredFile(fileId, name){
  const w = window.open('', '_blank');
  try{
    const blob = await fetchStoredFile(fileId);
    const url = URL.createObjectURL(blob);
    if(w){ w.location.href = url; } else { await downloadStoredFile(fileId, name); }
    setTimeout(()=>URL.revokeObjectURL(url), 120000);
  }catch(e){ if(w) w.close(); showErrorBanner('Could not open', e.message); }
}
function downloadDoc(cid, idx){ const d = (byId(cid).documents||[])[idx]; if(d && d.fileId) downloadStoredFile(d.fileId, d.name); }
function viewDoc(cid, idx){ const d = (byId(cid).documents||[])[idx]; if(d && d.fileId) viewStoredFile(d.fileId, d.name); }
function downloadInvoice(cid, iid){ const inv = (byId(cid).invoices||[]).find(x=>x.id===iid); if(inv && inv.fileId) downloadStoredFile(inv.fileId, inv.fileName); }

}

function newDocId(){ return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function isClientDoc(c, d){ return d.uploadedByRole==='importer' || d.uploadedByRole==='agent' || (!d.uploadedByRole && (d.uploadedBy===c.owner || d.uploadedBy===c.agent)); }
function isReplaced(c, d){ return !!d.id && (c.documents||[]).some(x=>x.replaces===d.id); }
function docsNeedingFix(c){
  const docs = c.documents||[];

}
function docRowHTML(c, d, i, ctx){
  const rejected = !!d.rejected;

  const mine = d.uploadedBy===state.person;
  const who = d.onBehalfOf ? `${docEsc(d.uploadedBy)} (BILBT staff), on behalf of ${docEsc(d.onBehalfOf)}` : docEsc(d.uploadedBy);
  let pill = '';
  if(rejected) pill = `<span class="pill stepped" style="margin-left:6px;">Rejected</span>`;
  else if(d.replaces) pill = `<span class="pill ok" style="margin-left:6px;">Corrected upload</span>`;
  const fileBtns = d.fileId
    ? `<button class="btn small ghost" onclick="viewDoc('${c.id}',${i})">View</button><button class="btn small secondary" onclick="downloadDoc('${c.id}',${i})">Download</button>`
    : `<span class="tag-line">No file stored (older record)</span>`;
  const canReject = ctx.staff && canRejectDocs() && !rejected && isClientDoc(c,d);
  const canFix = rejected && !replaced && ((ctx.staff && canRejectDocs()) || (ctx.client && mine));
  const rejectingHere = state.rejectingDoc===(c.id+':'+i);
  let extra = '';
  if(rejected){
    extra += `<div style="flex-basis:100%; background:#FDECEA; border:1px solid #E5A29B; color:#7A1F17; border-radius:8px; padding:8px 10px; font-size:12.5px;">
      <b>Rejected by ${docEsc(d.rejected.by)}</b> · ${fmtDate(d.rejected.date)}<br>${docEsc(d.rejected.reason)}
      ${replaced?'<br><i>A corrected document has been uploaded.</i>':''}
    </div>`;
  }
  if(rejectingHere){
    extra += `<div style="flex-basis:100%;">
      <textarea id="doc-reject-reason" rows="2" placeholder="What is wrong with this document? The importer or agent will see this." style="margin:6px 0;"></textarea>
      <div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn small danger" onclick="confirmRejectDoc('${c.id}',${i})">Reject document</button><button class="btn small ghost" onclick="cancelRejectDoc('${c.id}')">Cancel</button></div>
    </div>`;
  }
  const actions = [];
  if(canReject && !rejectingHere) actions.push(`<button class="btn small danger" onclick="startRejectDoc('${c.id}',${i})">Reject</button>`);
  if(canFix) actions.push(ctx.staff
    ? `<button class="btn small secondary" onclick="startReplaceDoc('${c.id}',${i})">Upload the correct one</button>`
    : `<button class="btn small" onclick="startReplaceDoc('${c.id}',${i})">Re-upload</button>`);
  return `<div class="doc-row" style="flex-wrap:wrap; gap:6px;">
    <span>📄 ${docEsc(d.name)} <span class="tag-line" style="margin-left:4px;">${docEsc(d.type)}</span>${pill}</span>
    <span class="tag-line">${fmtDate(d.date)}${d.sizeKB?` · ${d.sizeKB} KB`:''} · ${who}</span>
    <span style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">${fileBtns}${actions.join('')}</span>
    ${extra}
  </div>`;
}
function documentsSectionHTML(c, ctx){
  const docs = c.documents||[];
  const rows = docs.map((d,i)=>docRowHTML(c,d,i,ctx)).join('') || '<div class="tag-line">No documents uploaded yet.</div>';
  if(!(ctx.staff || ctx.client)) return rows;
  let rp = null;
  if(state.docReplace && state.docReplace.cid===c.id){ const t = docs[state.docReplace.idx]; if(t && t.rejected && !isReplaced(c,t)) rp = t; }
  const clients = [...new Set([c.owner, c.agent].filter(Boolean))];
  const behalfDefault = rp && clients.includes(rp.uploadedBy) ? rp.uploadedBy : '';
  const form = `
    <div style="margin-top:12px;">
      ${rp?`<div class="alert-card" style="margin-bottom:10px;"><h4>Replacing a rejected ${docEsc(rp.type)}</h4><p>“${docEsc(rp.name)}” was rejected: ${docEsc(rp.rejected.reason)}</p><button class="btn small ghost" onclick="cancelReplaceDoc('${c.id}')">Cancel</button></div>`:''}
      <div class="field" style="margin-bottom:8px;"><label>Choose file</label><input type="file" id="doc-file" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx,.csv,.txt"></div>
      ${rp?'':`<select id="doc-type" style="margin-bottom:8px;">${docTypesFor().map(t=>`<option>${t}</option>`).join('')}</select>`}
      ${ctx.staff && canRejectDocs() && clients.length?`<select id="doc-behalf" style="margin-bottom:8px;"><option value="">Upload as BILBT staff (my own document)</option>${clients.map(n=>`<option value="${docEsc(n)}" ${n===behalfDefault?'selected':''}>On behalf of ${docEsc(n)}</option>`).join('')}</select>`:''}
      <button class="btn small secondary" id="doc-submit" onclick="submitDocument('${c.id}')">${rp?'Upload corrected document':'Upload document'}</button>
      <div class="hint">PDF, image, Word, Excel, CSV or text, up to ${FILE_MAX_MB} MB. The file itself is stored on the server, and anyone who can see this job can download it.</div>
    </div>`;
  return rows + form;
}
function startRejectDoc(cid, idx){ state.rejectingDoc = cid+':'+idx; openContainer(cid); }
function cancelRejectDoc(cid){ state.rejectingDoc = null; openContainer(cid); }
function startReplaceDoc(cid, idx){ state.docReplace = {cid, idx}; openContainer(cid); }
function cancelReplaceDoc(cid){ state.docReplace = null; openContainer(cid); }
async function confirmRejectDoc(cid, idx){
  const c = byId(cid); const d = (c.documents||[])[idx];
  if(!d) return;
  if(!canRejectDocs()){ toast('Only Admin, Documentation or DTI staff can reject a document.'); return; }
  const reason = ((document.getElementById('doc-reject-reason')||{}).value||'').trim();
  if(reason.length<3){ toast('Say what is wrong with the document so the importer or agent knows what to fix.'); return; }
  if(!d.id) d.id = newDocId();
  d.rejected = {by:state.person, date:new Date().toISOString(), reason:reason.slice(0,500)};
  if(!(await saveContainers(state.containers))) return;
  state.rejectingDoc = null;
  await pushLog(`Document rejected on ${c.containerNumber}: ${d.type} “${d.name}” — ${reason} (by ${state.person})`, null, c.terminalId);
  toast('Document rejected. The importer or agent can now upload the correct one, or you can upload it for them.');
  openContainer(cid);
}
async function submitDocument(cid){
  const c = byId(cid);
  const isClient = state.role==='importer' || state.role==='agent';
  const rp = (state.docReplace && state.docReplace.cid===cid) ? (c.documents||[])[state.docReplace.idx] : null;
  const replacing = rp && rp.rejected && !isReplaced(c, rp) ? rp : null;
  const type = replacing ? replacing.type : (document.getElementById('doc-type')||{}).value;
  if(!docTypesFor().includes(type)){ toast('You can only upload a Bill of Lading, a PAAR, or Other documents.'); return; }
  const fileInput = document.getElementById('doc-file');
  const file = fileInput && fileInput.files && fileInput.files[0];
  const bad = checkPickedFile(file);
  if(bad){ toast(bad); return; }
  const behalfEl = document.getElementById('doc-behalf');
  const behalf = (!isClient && behalfEl && behalfEl.value) ? behalfEl.value : null;
  const btn = document.getElementById('doc-submit');
  if(btn){ btn.disabled = true; btn.textContent = 'Uploading…'; }
  let up;
  try{ up = await uploadFileToServer(file); }
  catch(e){
    if(btn){ btn.disabled = false; btn.textContent = replacing ? 'Upload corrected document' : 'Upload document'; }
    if(e && e.status===401){ sessionExpired(); return; }
    showErrorBanner('Not uploaded', e.message); return;
  }
  const doc = {id:newDocId(), name:up.name, type, uploadedBy:state.person, uploadedByRole:(isClient?state.role:'staff'), date:new Date().toISOString(), sizeKB:Math.max(1,Math.round(up.size/1024)), fileId:up.id, mime:up.mime};
  if(behalf) doc.onBehalfOf = behalf;
  if(replacing) doc.replaces = replacing.id;
  const liveJob = byId(cid) || c; // the screen may have refreshed while the file was uploading
  liveJob.documents.push(doc);
  if(!(await saveContainers(state.containers))) return;
  state.docReplace = null;
  await pushLog(`${type} ${replacing?'(corrected) ':''}uploaded for ${c.containerNumber}${behalf?' on behalf of '+behalf:''} (by ${state.person})`, null, c.terminalId);
  toast(`${up.name} uploaded.`);
  openContainer(cid);
}

    <div class="topbar"><div><h1>Mother Port Movements</h1><div class="desc">Transire/letter movement from CPC-CAC through loading and exit at WACT/OMT, across every registered bonded terminal, until each container reaches its bonded terminal. Every stage change below is time-stamped, not just dated.</div></div></div>
    <div class="metric-row">
      <div class="metric"><div class="num">${list.length}</div><div class="lbl">Containers at Mother Port stages</div></div>
      <div class="metric"><div class="num">${byStage['CPC-CAC']||0}</div><div class="lbl">At CPC-CAC (just started)</div></div>
      <div class="metric"><div class="num">${byStage['MPT-LOAD']||0}</div><div class="lbl">Loading at MPT</div></div>
      <div class="metric"><div class="num">${byStage['MPT-EXIT']||0}</div><div class="lbl">Exiting Mother Port</div></div>
    </div>
    <div class="panel"><div class="panel-head"><h3>All Mother Port jobs</h3>
      <div class="toolbar"><input type="text" id="job-search" placeholder="Search container, BOL…" oninput="filterJobRows(this.value)"></div></div>
      <div class="panel-body" style="padding:0 18px;" id="job-list">${jobListHTML(list, {showTerminal:true})}</div></div>`;
}
function filterTerminalRows(q){
  q=(q||'').toLowerCase();
  document.querySelectorAll('#terminal-rows .staff-row').forEach(r=>{ r.style.display = r.dataset.tname.includes(q)?'grid':'none'; });
}
function selectCustomsTerminal(tid){ state.custSelectedTerminal = tid; renderTab(); }
function customsDirectoryHTML(){
  const selected = state.custSelectedTerminal ? terminalById(state.custSelectedTerminal) : null;
  const list = selected ? state.containers.filter(c=>c.terminalId===selected.id) : [];
  return `
    <div class="topbar"><div><h1>Terminal Directory</h1><div class="desc">Search for a registered bonded terminal to see all of its job movements — from letter processing at the Mother Port through delivery to the customer.</div></div></div>
    <div class="panel"><div class="panel-head"><h3>Registered terminals</h3></div>
      <div class="panel-body">
        <input type="text" id="terminal-search" placeholder="Search terminal name or address…" oninput="filterTerminalRows(this.value)" style="margin-bottom:10px;">
        <div id="terminal-rows">
          ${state.terminals.length===0? '<div class="tag-line">No terminals registered yet.</div>' : state.terminals.map(t=>`<div class="staff-row" data-tname="${t.name.toLowerCase()}" style="grid-template-columns:2fr 1fr 1fr auto; cursor:pointer;" onclick="selectCustomsTerminal('${t.id}')">
            <span><b>${t.name}</b><div class="tag-line">${t.address}</div></span>
            <span>${state.containers.filter(c=>c.terminalId===t.id).length} jobs</span>
            <span><span class="pill ${t.status==='active'?'ok':'wait'}">${t.status}</span></span>
            <span class="btn small secondary" style="pointer-events:none;">View jobs</span>
          </div>`).join('')}
        </div>
      </div></div>
    ${selected ? `
    <div class="panel"><div class="panel-head"><h3>${selected.name} — all job movements</h3></div>
      <div class="panel-body" style="padding:0 18px;">${jobListHTML(list)}</div></div>` : ''}`;
}
function customsSearchHTML(){
  return `
    <div class="topbar"><div><h1>Container / BOL Search</h1><div class="desc">Find which bonded terminal a container or Bill of Lading is registered with.</div></div></div>
    <div class="panel"><div class="panel-body">
      <div class="field"><label>Container number or Bill of Lading</label><input type="text" id="cust-search-input" placeholder="e.g. MAEU1234567 or BL-88291"></div>
      <button class="btn small" onclick="runCustomsSearch()">Search</button>
      <div id="cust-search-results" style="margin-top:16px;"></div>
    </div></div>`;
}
function runCustomsSearch(){
  const q = document.getElementById('cust-search-input').value.trim().toLowerCase();
  const results = document.getElementById('cust-search-results');
  if(!q){ results.innerHTML = '<div class="tag-line">Enter a container number or Bill of Lading.</div>'; return; }
  const matches = state.containers.filter(c=>c.containerNumber.toLowerCase().includes(q) || c.billOfLading.toLowerCase().includes(q));
  if(matches.length===0){ results.innerHTML = '<div class="empty-state"><div class="glyph">// //</div>No container or Bill of Lading matches that search.</div>'; return; }
  const terminalsFound = [...new Set(matches.map(m=>terminalName(m.terminalId)))];
  results.innerHTML = `<div class="hint" style="margin-bottom:8px;">Registered with: <b>${terminalsFound.join(', ')}</b></div>` + jobListHTML(matches, {showTerminal:true});
}
function customsCommentsHTML(){
  const active = state.custSelectedTerminal || (state.terminals[0] && state.terminals[0].id);
  const t = active ? terminalById(active) : null;
  const channel = 'customs:'+active;
  const msgs = active ? state.messages.filter(m=>m.channel===channel) : [];
  return `
    <div class="topbar"><div><h1>Comments</h1><div class="desc">Interface directly with a bonded terminal's staff about transire and container movement.</div></div></div>
    <div class="detail-grid">
      <div>
        <div class="panel"><div class="panel-head"><h3>Conversation with ${t?t.name:'—'}</h3></div>
          <div class="panel-body">
            <div id="thread-msgs" style="max-height:380px; overflow-y:auto; margin-bottom:14px;">
              ${msgs.length? msgs.map(m=>msgBubbleHTML(m)).join('') : '<div class="tag-line">No messages with this terminal yet.</div>'}
            </div>
            <textarea id="msg-text" rows="2" placeholder="Type a message…" ${t?'':'disabled'}></textarea>
            <div class="field" style="margin-top:8px;"><label>Attach a document (optional)</label><input type="file" id="msg-file" ${t?'':'disabled'}></div>
            <button class="btn small" onclick="sendMessage('${channel}')" ${t?'':'disabled'}>Send</button>
          </div></div>
      </div>
      <div>
        <div class="panel"><div class="panel-head"><h3>Terminals</h3></div>
          <div class="panel-body">
            ${state.terminals.length===0? '<div class="tag-line">No terminals registered yet.</div>' : state.terminals.map(tt=>`<div class="thread-item ${tt.id===active?'active':''}" onclick="state.custSelectedTerminal='${tt.id}'; renderTab();"><b>${tt.name}</b><div class="tag-line">${tt.address}</div></div>`).join('')}
          </div></div>
      </div>
    </div>`;
}

/* ========================= INIT ========================= */
/* Show / Hide button on every password box, including ones drawn later. */
function addPasswordToggles(){
  document.querySelectorAll('input[type=password]:not([data-pw])').forEach(inp=>{
    inp.setAttribute('data-pw','1');
    const wrap=document.createElement('span'); wrap.className='pw-wrap';
    inp.parentNode.insertBefore(wrap,inp); wrap.appendChild(inp);
    const b=document.createElement('button'); b.type='button'; b.className='pw-toggle'; b.textContent='Show'; b.tabIndex=-1;
    b.addEventListener('click',()=>{ const show=inp.type==='password'; inp.type=show?'text':'password'; b.textContent=show?'Hide':'Show'; });
    wrap.appendChild(b);
  });
}
new MutationObserver(addPasswordToggles).observe(document.body,{childList:true,subtree:true});
addPasswordToggles();

let _busyCount=0, _busyTimer=null, _busyAuto=false, _busyExplicit=false;
function _paintBusy(msg){
  let el=document.getElementById('busy-overlay');
  if(!el){ el=document.createElement('div'); el.id='busy-overlay'; el.innerHTML='<div class="busy-box"><div class="busy-spin"></div><div class="busy-msg"></div></div>'; document.body.appendChild(el); }
  el.querySelector('.busy-msg').textContent=msg||'Loading…'; el.style.display='flex';
}
function _clearBusy(){ const el=document.getElementById('busy-overlay'); if(el) el.style.display='none'; }
function showBusy(msg){ _busyExplicit=true; _paintBusy(msg); }          // shown right away, until a screen is drawn
function hideBusy(){ _busyExplicit=false; _busyAuto=false; clearTimeout(_busyTimer); _clearBusy(); }
// Any request that changes something shows the spinner if it takes longer than a third of a second.
function busyBegin(msg){ _busyCount++; if(_busyCount===1){ _busyTimer=setTimeout(()=>{ if(!_busyExplicit){ _busyAuto=true; _paintBusy(msg); } },350); } }
function busyEnd(){ _busyCount=Math.max(0,_busyCount-1); if(_busyCount===0){ clearTimeout(_busyTimer); if(_busyAuto){ _busyAuto=false; if(!_busyExplicit) _clearBusy(); } } }
function busyMessageFor(path){
  if(/\/auth\/login/.test(path)) return 'Signing you in…';
  if(/\/auth\/register/.test(path)) return 'Creating the account…';
  if(/\/auth\/set-password/.test(path)) return 'Updating the password…';
  return 'Saving…';
}

async function restoreSession(){
  // The sign-in token lives in localStorage, so a refresh picks the session back up.
  // The token is only thrown away when the server says it is no longer good, never because a read was slow or failed.
  const token = getAuthToken(); if(!token) return false;
  let payload;
  try{ payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }catch(e){ setAuthToken(''); return false; }
  if(!payload.id || (payload.exp && payload.exp*1000 < Date.now())){ setAuthToken(''); return false; }
  const boot = bootStatic();                         // terminals + settings load at the same time as the accounts
  for(let attempt=0; attempt<3; attempt++){
    const failsBefore = window.__storageFailures||0;
    let users = null; try{ users = await loadUsers(); }catch(e){}
    if(!getAuthToken()) return false;                // the server answered 401: the token is no longer valid
    if(!users || (window.__storageFailures||0)!==failsBefore){ await new Promise(r=>setTimeout(r,1500)); continue; }  // a failed read: keep the token and try again
    const u = users.find(x=>x.id===payload.id);
    if(!u || u.status!=='active'){ setAuthToken(''); return false; }
    await boot;
    state.users = users;
    try{ await finishLogin(u.id); return true; }catch(e){ console.error(e); break; }
  }
  state.authError = 'Could not reach the server. You are still signed in: refresh the page to try again.';
  return false;
}
(async function init(){
  if(getApiBase()){
    await tryBootstrapServer();
    if(getAuthToken()){
      showBusy('Restoring your session…');
      const restored = await restoreSession();
      hideBusy();
      if(restored) return;
      if(!state.terminals || !state.terminals.length) await bootStatic();
    } else {
      await bootStatic();
    }
  }
  renderLogin();
})();
</script>
