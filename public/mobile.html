<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ConTracker — Mobile</title>
<meta name="theme-color" content="#14110B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ConTracker">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2314110B'/%3E%3Ctext x='50' y='64' font-family='monospace' font-size='38' font-weight='700' fill='%23D9A62E' text-anchor='middle'%3ECT%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2314110B'/%3E%3Ctext x='50' y='64' font-family='monospace' font-size='38' font-weight='700' fill='%23D9A62E' text-anchor='middle'%3ECT%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"ConTracker","short_name":"ConTracker","start_url":".","display":"standalone","background_color":"%2314110B","theme_color":"%2314110B"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141414; --ink-2:#232019; --ink-soft:#5A5648;
    --gold:#B8902E; --gold-2:#8F6F22; --gold-soft:#F4E9C8;
    --yellow:#F0C23A; --yellow-soft:#FBF0D2;
    --paper:#FBFAF6; --panel:#FFFFFF; --line:#E7E2D2;
    --rust:#A33A2E; --rust-soft:#F5DCD6; --stamp:#8A2E2E;
    --leaf:#3E7D46; --leaf-soft:#DCEBD8;
    --radius:3px; --shadow:0 1px 2px rgba(20,20,20,.08), 0 6px 18px rgba(20,20,20,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans', sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Zilla Slab', serif;font-weight:600;margin:0 0 .3em 0;color:var(--ink);letter-spacing:.2px;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#ddd6bd;border-radius:6px;}

  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:24px;
    background-image:repeating-linear-gradient(135deg, rgba(184,144,46,.07) 0 2px, transparent 2px 26px);}
  .auth-shell{width:100%;max-width:440px;}
  .auth-brand{text-align:center;margin-bottom:22px;}
  .auth-brand .stamp-mark{width:48px;height:48px;border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--gold);font-size:11px;margin:0 auto 12px;background:rgba(184,144,46,.1);}
  .auth-brand h1{color:#fff;font-size:22px;margin-bottom:4px;letter-spacing:.5px;}
  .auth-brand .sub{color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;}
  .auth-card{background:var(--panel);border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:32px 30px;max-height:88vh;overflow-y:auto;border-top:4px solid var(--gold);}
  .auth-card h2{font-size:19px;margin-bottom:6px;}
  .auth-card .lede{color:var(--ink-soft);font-size:13px;margin-bottom:22px;}
  .welcome-pitch{color:var(--ink-soft);text-align:center;font-size:13.5px;max-width:36ch;margin:0 auto 26px;}
  .welcome-actions{display:flex;flex-direction:column;gap:10px;}
  select, input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=tel], input[type=file], textarea{
    width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:10px 11px;font-family:inherit;font-size:13.5px;background:#fff;color:var(--ink);}
  input[type=file]{padding:7px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--yellow);padding:10px 18px;border-radius:var(--radius);font-weight:600;font-size:13.5px;letter-spacing:.2px;}
  .btn:hover{background:var(--ink-2);}
  .btn.secondary{background:#fff;color:var(--ink);border-color:var(--gold);}
  .btn.secondary:hover{background:var(--gold-soft);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:8px 10px;}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn.full{width:100%;}
  .btn.danger{border-color:var(--rust);background:#fff;color:var(--rust);}
  .btn.danger:hover{background:var(--rust-soft);}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#fff;}
  .btn.gold:hover{background:var(--gold-2);}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}
  .field label{display:block;font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .field .fhint{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:600px){ .form-grid{grid-template-columns:1fr;} }
  .auth-foot{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:16px;}
  .auth-foot button{color:var(--gold-2);font-weight:600;text-decoration:underline;background:none;border:none;padding:0;}
  .demo-box{background:var(--yellow-soft);border:1px solid #E9D68F;border-radius:var(--radius);padding:10px 12px;font-size:11.5px;color:#6E5610;margin-top:16px;}
  .demo-box b{font-family:'IBM Plex Mono',monospace;}
  .err-text{color:var(--rust);font-size:12px;margin:-6px 0 10px;}
  .otp-banner{background:var(--yellow-soft); border:1px solid #E9D68F; border-radius:var(--radius); padding:10px 12px; font-size:12px; color:#6E5610; margin-bottom:14px;}
  .otp-banner b{font-family:'IBM Plex Mono',monospace; font-size:15px; letter-spacing:3px;}

  #app-shell{display:none; min-height:100vh; grid-template-columns:230px 1fr;}
  @media (min-width:861px){ #app-shell{display:grid;} }
  .sidebar{background:var(--ink);color:#E9E4D3;padding:20px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .sidebar .brand{margin-bottom:24px;}
  .sidebar .brand .stamp-mark{width:36px;height:36px;border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--gold);font-size:11px;margin-bottom:10px;}
  .sidebar .brand h2{color:#fff;font-size:16px;margin-bottom:2px;line-height:1.25;}
  .sidebar .brand .sub{font-size:10px;color:var(--gold);font-family:'IBM Plex Mono',monospace;letter-spacing:.6px;}
  .nav-item{padding:9px 10px;border-radius:var(--radius);font-size:13px;font-weight:500;color:#CFC9B4;margin-bottom:2px;display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .nav-item.active{background:rgba(184,144,46,.22); color:#fff;}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-badge{background:var(--gold);color:#1A1A1A;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;}
  .sidebar-foot{margin-top:auto; border-top:1px solid rgba(255,255,255,.14); padding-top:14px;}
  .who{font-size:12.5px; color:#fff; font-weight:600; display:flex; align-items:center; gap:8px;}
  .who .role-tag{display:block;font-size:10.5px;color:var(--gold);font-family:'IBM Plex Mono',monospace;margin-top:2px;letter-spacing:.6px;}
  .who .dept-tag{display:block;font-size:10.5px;color:#B9C9B0;margin-top:1px;}

  .main{padding:26px 30px 60px; max-width:1260px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .topbar h1{font-size:22px;margin-bottom:4px;}
  .topbar .desc{color:var(--ink-soft);font-size:13px;max-width:64ch;}
  .mobile-topbar{display:none;position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:12px 16px;align-items:center;justify-content:space-between;}
  @media (max-width:860px){
    .mobile-topbar{display:flex;}
    .sidebar{position:fixed;left:0;top:0;z-index:30;width:230px;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.35);}
    .sidebar.open{transform:translateX(0);}
    .main{padding:18px 16px 60px;}
  }
  .hold-banner{background:var(--rust);color:#fff;padding:10px 16px;border-radius:var(--radius);font-size:12.5px;font-weight:600;margin-bottom:18px;letter-spacing:.3px;}
  .dup-banner{background:var(--yellow-soft);border:1px solid #E9D68F;color:#6E5610;padding:10px 16px;border-radius:var(--radius);font-size:12.5px;font-weight:600;margin-bottom:14px;}

  .metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  @media (max-width:760px){ .metric-row{grid-template-columns:repeat(2,1fr);} }
  .metric{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--gold);}
  .metric .num{font-family:'Zilla Slab',serif;font-size:23px;color:var(--ink);font-weight:600;line-height:1;}
  .metric .lbl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.7px;margin-top:6px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .panel-head h3{font-size:15px;margin:0;}
  .panel-body{padding:16px 18px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .toolbar input,.toolbar select{width:auto;min-width:130px;}
  .inbox-panel{border:1px solid #E9D68F; background:var(--yellow-soft);}
  .inbox-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #E9D68F;font-size:12.5px;}
  .inbox-row:last-child{border-bottom:none;}

  .job-row{display:grid;grid-template-columns:120px 1.4fr 1.6fr 90px 100px;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .job-row:last-child{border-bottom:none;}
  .job-row:hover{background:#FBF7EA;}
  .job-row .cnum{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;}
  .job-row .bol{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .job-row .stage-lbl{font-size:12.5px;color:var(--ink-soft);}
  .job-row .owner{font-size:11.5px;color:var(--ink-soft);}
  @media (max-width:700px){ .job-row{grid-template-columns:1fr;gap:4px;} }
  .flag{display:inline-flex;align-items:center;gap:5px;background:var(--rust-soft);color:var(--stamp);border:1px solid #E3B3AC;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}
  .flag::before{content:"●";font-size:8px;}
  .pill{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .pill.ok{background:var(--gold-soft);color:var(--gold-2);}
  .pill.wait{background:var(--yellow-soft);color:#8A6A0E;}
  .pill.done{background:#EDE9DA;color:var(--ink-soft);}
  .pill.stepped{background:var(--rust-soft);color:var(--stamp);}
  .pill.dup{background:var(--yellow-soft);color:#8A6A0E;border:1px solid #E9D68F;}

  .rail-wrap{overflow-x:auto;padding-bottom:6px;}
  .rail{display:flex;min-width:900px;position:relative;padding:26px 0 10px;}
  .rail::before{content:"";position:absolute;left:0;right:0;top:34px;height:2px;background:var(--line);}
  .rail-step{flex:1;text-align:center;position:relative;padding:0 3px;}
  .rail-dot{width:15px;height:15px;border-radius:50%;margin:0 auto 8px;position:relative;z-index:2;background:#fff;border:2px solid var(--line);}
  .rail-step.complete .rail-dot{background:var(--gold);border-color:var(--gold);}
  .rail-step.current .rail-dot{background:var(--yellow);border-color:var(--gold);box-shadow:0 0 0 4px var(--yellow-soft);}
  .rail-step.complete::before,.rail-step.current::before{content:"";position:absolute;left:0;right:50%;top:34px;height:2px;background:var(--gold);z-index:1;}
  .rail-step:first-child::before{left:50%;}
  .rail-code{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);letter-spacing:.4px;}
  .rail-step.complete .rail-code,.rail-step.current .rail-code{color:var(--ink);font-weight:600;}
  .rail-name{font-size:10.5px;color:var(--ink-soft);margin-top:2px;max-width:110px;margin-left:auto;margin-right:auto;}
  .stamp-badge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);color:var(--ink);padding:5px 12px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transform:rotate(-2deg);}

  .detail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
  @media (max-width:900px){ .detail-grid{grid-template-columns:1fr;} }
  .kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:13px;margin-bottom:6px;}
  .kv b{color:var(--ink-soft);font-weight:500;font-size:12px;}
  .history-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
  .history-row:last-child{border-bottom:none;}
  .history-row .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);margin-top:5px;flex-shrink:0;}
  .history-row .t{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:11px;white-space:nowrap;}
  .alert-card{border:1px solid #E3B3AC;background:var(--rust-soft);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
  .alert-card h4{color:var(--stamp);font-size:13px;margin-bottom:4px;}
  .alert-card p{margin:0 0 8px;font-size:12.5px;color:var(--ink);}
  .bol-card{border:1px solid #E9D68F;background:var(--yellow-soft);border-radius:var(--radius);padding:12px;margin-bottom:14px;}
  .bol-card h4{color:#6E5610;font-size:13px;margin-bottom:6px;}
  .stepdown-card{border:1px solid #E3B3AC;background:var(--rust-soft);border-radius:var(--radius);padding:12px;margin-bottom:14px;}
  .stepdown-card h4{color:var(--stamp);font-size:13px;margin-bottom:6px;}
  .refnum-card{border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--radius);padding:14px;margin-bottom:16px;}
  .refnum-card h4{color:var(--gold-2);font-size:13px;margin-bottom:8px;}
  .doc-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .doc-row:last-child{border-bottom:none;}
  .fin-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .fin-row:last-child{border-bottom:none;font-weight:600;}
  .fin-edit-row{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;padding:6px 0;}
  .fin-edit-row label{font-size:12px;color:var(--ink-soft);}
  .modal-bg{position:fixed;inset:0;background:rgba(20,20,20,.6);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--panel);border-radius:var(--radius);max-width:960px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:4px solid var(--gold);}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .modal-body{padding:20px 22px;}
  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state .glyph{font-family:'IBM Plex Mono',monospace;font-size:26px;color:var(--line);margin-bottom:8px;}

  .err-banner{position:fixed;top:0;left:0;right:0;z-index:120;background:#8E2A14;color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 4px 18px rgba(0,0,0,.35);font-size:13.5px;line-height:1.45;}
  .err-banner b{display:block;font-size:14px;margin-bottom:2px;}
  .err-banner .eb-body{flex:1;min-width:0;word-wrap:break-word;}
  .err-banner button{background:#fff;color:#8E2A14;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer;flex:none;}
  #toast-wrap{position:fixed;bottom:18px;right:18px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:340px;}
  .toast{background:var(--ink);color:var(--yellow);padding:12px 14px;border-radius:var(--radius);font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.3);border-left:4px solid var(--gold);animation:slidein .2s ease-out;}
  @keyframes slidein{from{transform:translateY(8px);opacity:0;} to{transform:translateY(0);opacity:1;}}
  .action-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
  .action-item:last-child{border-bottom:none;}
  .action-item .txt{font-size:13px;}
  .action-item .txt .cn{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .tag-line{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin:22px 0 10px;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .bar-row{margin-bottom:10px;}
  .bar-row .bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .bar-track{background:#EFEADA;border-radius:20px;height:9px;overflow:hidden;}
  .bar-fill{background:var(--gold);height:100%;border-radius:20px;}
  .bar-fill.amber{background:var(--yellow);}
  .bar-fill.rust{background:var(--rust);}
  .dept-chip{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--gold-2);background:var(--gold-soft);padding:2px 7px;border-radius:10px;margin-right:6px;}
  .terminal-chip{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:#fff;background:var(--ink);padding:2px 7px;border-radius:10px;margin-right:6px;}
  .staff-row{display:grid;grid-template-columns:1fr 1.2fr .9fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .staff-row:last-child{border-bottom:none;}
  @media (max-width:800px){ .staff-row{grid-template-columns:1fr 1fr; row-gap:4px;} }
  .charge-edit{display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-top:8px;}
  .charge-edit .field{margin-bottom:0; flex:1; min-width:130px;}
  .avatar{width:52px;height:52px;border-radius:50%;background:var(--gold-soft);color:var(--gold-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Zilla Slab',serif;font-size:18px;object-fit:cover;flex-shrink:0;}
  .avatar-sm{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--gold-soft);}
  .perm-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
  .perm-row:last-child{border-bottom:none;}
  .perm-yes{color:var(--leaf);font-weight:700;}
  .perm-no{color:var(--rust);font-weight:700;}
  .thread-item{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .thread-item:hover{background:#FBF7EA;}
  .thread-item.active{background:var(--gold-soft);}
  .msg-bubble{background:#F3F0E4;border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:12.5px;max-width:80%;}
  .msg-bubble.mine{background:var(--gold-soft);margin-left:auto;}
  .msg-meta{font-size:10.5px;color:var(--ink-soft);margin-bottom:3px;}
  .terminal-card{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  .terminal-card h4{font-size:15px;margin-bottom:4px;}
  .idcard-preview{max-width:260px;border-radius:var(--radius);border:1px solid var(--line);margin-top:8px;}

  /* ========================= MOBILE APP SHELL (overrides everything above) ========================= */
  html,body{height:100%;}

};
const STATIONS = ['Onne Port Area II Command','WACT Office','OMT Office','Bonded Terminal Main Yard'];

let state = { role:null, person:null, userId:null, department:null, terminalId:null, activeTab:'dashboard',
  terminals:[], containers:[], log:[], users:[], settings:null, referrals:[], messages:[],
  authView:'welcome', authError:'', regDraft:null, otp:null, otpChannel:null,
  profileTargetId:null, supportThreadKey:null, custSelectedTerminal:null, openContainerId:null };

/* ========================= API CLIENT =========================
   ConTracker is a static page with no backend of its own, so it talks to a
   small real server (Node + PostgreSQL) over HTTPS for every read and write —
   shared across every terminal's staff, SCTL, and Customs, on every device.
   Each browser is told the server's URL once (saved locally); from then on,
   window.storage.get/set is a real network request to that server. */
const API_BASE_KEY = 'contracker_api_base';
function getApiBase(){ try{ return localStorage.getItem(API_BASE_KEY) || (location.protocol.indexOf('http')===0 ? location.origin : ''); }catch(e){ return ''; } }
function setApiBase(url){ try{ localStorage.setItem(API_BASE_KEY, String(url||'').trim().replace(/\/+$/,'')); }catch(e){} }
function getAuthToken(){ try{ return localStorage.getItem('contracker_token') || ''; }catch(e){ return ''; } }
function setAuthToken(t){ try{ if(t) localStorage.setItem('contracker_token', t); else localStorage.removeItem('contracker_token'); }catch(e){} }

async function apiFetch(path, opts){
  const method = ((opts && opts.method) || 'GET').toUpperCase();
  if(method==='GET') return apiFetchInner(path, opts);
  busyBegin(busyMessageFor(path));
  try{ return await apiFetchInner(path, opts); } finally { busyEnd(); }
}
async function apiFetchInner(path, opts){
  const base = getApiBase();
  if(!base) { const e = new Error('No server configured yet.'); e.code='NO_API_BASE'; throw e; }
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const token = getAuthToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  let res;
  try{
    res = await fetch(base + path, Object.assign({}, opts, {headers}));
  }catch(netErr){
    const e = new Error('Could not reach the server. Check the server URL and your connection.');
    e.code='NETWORK'; throw e;
  }
  let body = null;
  try{ body = await res.json(); }catch(e){}
  if(res.status===401){ setAuthToken(''); }
  if(!res.ok){
    const err = new Error((body && body.error) || ('Request failed (HTTP '+res.status+').'));
    err.status = res.status; err.body = body;
    throw err;
  }
  return body;
}

window.__baseline = {};
function setBaseline(key, list){ const m = {}; (list||[]).forEach(r=>{ if(r && r.id!==undefined) m[r.id] = JSON.stringify(r); }); window.__baseline[key] = m; }
function adoptVersions(key, lists){ // after a save, take the new version numbers the server assigned
  const v = window.__lastVersions || {}; let all = [];
  lists.forEach(l=>(l||[]).forEach(r=>{ if(r && v[r.id]!==undefined) r._v = v[r.id]; all.push(r); }));
  setBaseline(key, all);
}
window.storage = {
  get: async function(key){
    let body; try{ body = await apiFetch('/api/storage/'+encodeURIComponent(key), {method:'GET'}); }catch(e){ window.__storageFailures=(window.__storageFailures||0)+1; throw e; }
    return (body && body.value!=null) ? { value: body.value } : null;
  },
  set: async function(key, value, shared, opts){
    const payload = {value: value};
    const base = (window.__baseline||{})[key];
    if(base){ // tell the server which records were really edited, so it never overwrites anyone else's
      try{ payload.changed = JSON.parse(value).filter(r=>r && base[r.id]!==JSON.stringify(r)).map(r=>r.id); }catch(e){}
    }
    if(opts && Array.isArray(opts.deleted)) payload.deleted = opts.deleted;
    if(window.__replaceAll) payload.replace = true;
    const resp = await apiFetch('/api/storage/'+encodeURIComponent(key), {method:'PUT', body: JSON.stringify(payload)});
    window.__lastVersions = (resp && resp.versions) || {};
  }
};

/* A brand-new server starts empty. The first SCTL account is created on the server with
   scripts/create-sctl.js; this page no longer sends any demo data. */
async function tryBootstrapServer(){ /* intentionally empty */ }

/* ========================= LIVE SYNC =========================
   Keeps every signed-in screen — any terminal's staff, SCTL, or Customs — up
   to date automatically across every device: a WebSocket push gives
   near-instant updates, with a background poll kept as a fallback in case
   the socket drops. */
let liveSyncTimer = null;
let liveSocket = null;
async function refreshFromStorage(){
  if(!state.role) return;
  try{
    const failsBefore = window.__storageFailures||0; const archBefore = JSON.stringify(state.archived||[]);
    const [terminals, containers, users, log, settings, referrals, messages] = await Promise.all([
      loadTerminals(), loadContainers(), loadUsers(), loadLog(), loadSettings(), loadReferrals(), loadMessages()
    ]);
    if((window.__storageFailures||0)!==failsBefore){ if(!getAuthToken()) sessionExpired(); return; } // a failed read must never replace live data with demo data
    const changed = JSON.stringify(state.archived||[])!==archBefore || JSON.stringify(terminals)!==JSON.stringify(state.terminals) ||
      JSON.stringify(containers)!==JSON.stringify(state.containers) ||
      JSON.stringify(users)!==JSON.stringify(state.users) ||
      JSON.stringify(log)!==JSON.stringify(state.log) ||
      JSON.stringify(referrals)!==JSON.stringify(state.referrals) ||
      JSON.stringify(messages)!==JSON.stringify(state.messages) ||
      JSON.stringify(settings)!==JSON.stringify(state.settings);
    if(!changed) return;
    state.terminals = terminals; state.containers = containers; state.users = users; state.log = log;
    state.settings = settings; state.referrals = referrals; state.messages = messages;
    if(typeof computeDuplicateFlags==='function') computeDuplicateFlags();
    const modalOpen = document.getElementById('modal-bg') && document.getElementById('modal-bg').classList.contains('open');
    if(modalOpen && state.editingJob){ /* a form is being filled in: do not wipe it */ }
    else if(modalOpen && state.openContainerId && byId(state.openContainerId)){
      openContainer(state.openContainerId);
    } else if(!modalOpen){
      renderApp();
    }
  }catch(e){ /* non-fatal — next tick retries */ }
}
function connectLiveSocket(){
  try{
    if(liveSocket){ try{ liveSocket.close(); }catch(e){} liveSocket=null; }
    const base = getApiBase(); const token = getAuthToken();
    if(!base || !token) return;
    const wsUrl = base.replace(/^http/,'ws') + '/ws?token=' + encodeURIComponent(token);
    const sock = new WebSocket(wsUrl);
    sock.onmessage = function(ev){
      try{ const msg = JSON.parse(ev.data); if(msg && msg.type==='changed') refreshFromStorage(); }catch(e){}
    };
    sock.onclose = function(){ if(liveSocket===sock) liveSocket=null; };
    sock.onerror = function(){ try{ sock.close(); }catch(e){} };
    liveSocket = sock;
  }catch(e){ /* WebSocket not available — the poll below still covers it */ }
}
function startLiveSync(){
  if(liveSyncTimer) return;
  connectLiveSocket();
  liveSyncTimer = setInterval(function(){
    if(!liveSocket || liveSocket.readyState!==1) connectLiveSocket();
    refreshFromStorage();
  }, 4000);
}
function stopLiveSync(){
  if(liveSyncTimer){ clearInterval(liveSyncTimer); liveSyncTimer=null; }
  if(liveSocket){ try{ liveSocket.close(); }catch(e){} liveSocket=null; }
}

/* ========================= STORAGE ========================= */
async function loadTerminals(){
  try{ const r = await window.storage.get('terminals', true); return r? JSON.parse(r.value) : seedTerminals(); }
  catch(e){ return seedTerminals(); }
}
async function saveTerminals(list){ state.terminals = list; try{ await window.storage.set('terminals', JSON.stringify(list), true); return true; }catch(e){ await handleSaveFailure(e); return false; } }
async function loadContainers(){
  let list; let readOk = true;
  try{ const r = await window.storage.get('containers', true); list = r? JSON.parse(r.value) : seedContainers(); }
  catch(e){ list = seedContainers(); readOk = false; }
  const all = list.map(normalizeContainer);
  if(readOk){ state.archived = all.filter(c=>c.archived); setBaseline('containers', all); }
  return all.filter(c=>!c.archived);
}
/* ---- Save failures: always tell the person, plainly, and put the screen back to what the server really has ---- */
window.__storageFailures = 0;
function showErrorBanner(title, detail, buttonLabel){
  try{
    let el = document.getElementById('err-banner');
    if(el) el.remove();
    el = document.createElement('div'); el.id='err-banner'; el.className='err-banner'; el.setAttribute('role','alert');
    const body = document.createElement('div'); body.className='eb-body';
    const b = document.createElement('b'); b.textContent = title; body.appendChild(b);
    body.appendChild(document.createTextNode(detail));
    const btn = document.createElement('button'); btn.textContent = buttonLabel || 'OK';
    btn.onclick = function(){ el.remove(); };
    el.appendChild(body); el.appendChild(btn);
    document.body.appendChild(el);
  }catch(e){ try{ alert(title + ' — ' + detail); }catch(_){} }
}
function describeSaveError(e){
  const st = e && e.status;
  if(st===401) return 'Your sign-in has expired, so that change was NOT saved. Please sign in again.';
  if(st===403) return ((e && e.message) || 'You are not allowed to make that change.') + ' Nothing was changed.';
  if(e && e.code==='NETWORK') return 'Could not reach the server, so nothing was saved. Check your internet connection and try again. If this screen still shows your change, refresh the page.';
  if(st===413) return 'That is too much data to save in one go. Nothing was changed.';
  if(st>=500) return 'The server had a problem and did not save your change. Please try again in a moment.';
  return ((e && e.message) || 'Something went wrong.') + ' Nothing was changed.';
}
function sessionExpired(){
  showErrorBanner('Session expired', 'Your sign-in has expired. Please sign in again. Anything you were saving at that moment was NOT saved.', 'Sign in');
  if(state.role){ try{ logout(); }catch(e){} }
}
async function handleSaveFailure(e){
  try{ console.error(e); }catch(_){}
  if(e && e.status===401){ sessionExpired(); return; }
  showErrorBanner('Not saved', describeSaveError(e));
  if(state.role){ try{ await refreshFromStorage(); }catch(_){} }
}
async function saveContainers(list, opts){
  state.containers = list;
  try{ await window.storage.set('containers', JSON.stringify(list.concat(state.archived||[])), true, opts); adoptVersions('containers', [list, state.archived]); return true; }
  catch(e){ await handleSaveFailure(e); return false; }
}
async function loadUsers(){ try{ const r = await window.storage.get('users', true); const list = r? JSON.parse(r.value) : seedUsers(); if(r) setBaseline('users', list); return list; }catch(e){ return seedUsers(); } }
async function saveUsers(list, opts){ state.users = list; try{ await window.storage.set('users', JSON.stringify(list), true, opts); adoptVersions('users', [list]); return true; }catch(e){ await handleSaveFailure(e); return false; } }
async function loadLog(){ try{ const r = await window.storage.get('activity-log', true); return r? JSON.parse(r.value) : []; }catch(e){ return []; } }

async function pushLog(msg, dept, terminalId){
  state.log.unshift({id:'l'+Date.now()+Math.random().toString(16).slice(2), msg, t:new Date().toISOString(), dept: dept||null, terminalId: terminalId!==undefined?terminalId:state.terminalId, ack:[]});
  state.log = state.log.slice(0,200);
  await saveLog();
}

async function saveReferrals(){ try{ await window.storage.set('referrals', JSON.stringify(state.referrals), true); return true; }catch(e){ await handleSaveFailure(e); return false; } }
async function loadMessages(){ try{ const r = await window.storage.get('messages', true); return r? JSON.parse(r.value) : []; }catch(e){ return []; } }
async function saveMessages(){ try{ await window.storage.set('messages', JSON.stringify(state.messages), true); return true; }catch(e){ await handleSaveFailure(e); return false; } }
async function loadSettings(){
  try{ const r = await window.storage.get('platform-settings', true); return r? Object.assign({}, defaultSettings(), JSON.parse(r.value)) : defaultSettings(); }
  catch(e){ return defaultSettings(); }
}
async function saveSettings(){ try{ await window.storage.set('platform-settings', JSON.stringify(state.settings), true); return true; }catch(e){ await handleSaveFailure(e); return false; } }
function defaultSettings(){
  return { freeDays:4, dailyPenaltyRate:15000, masterHold:false,
    features:{ endToEnd:true, referrals:true, support:true, finance:true } };
}
async function bootStatic(){
  try{ state.terminals = await loadTerminals(); }catch(e){ state.terminals = seedTerminals(); }
  try{ state.settings = await loadSettings(); }catch(e){ state.settings = defaultSettings(); }
}

function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); }
function mkHistory(uptoIdx, startDaysAgo, staffName){
  const hist=[]; let day=startDaysAgo;
  for(let i=0;i<=uptoIdx;i++){ hist.push({stage:i, t:daysAgo(day), user: staffName}); day -= (1+Math.floor(Math.random()*2)); }
  return hist.reverse();
}

/* ========================= HELPERS ========================= */
function fmtNaira(n){ return '₦' + Number(n||0).toLocaleString('en-NG'); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function byId(id){ return state.containers.find(c=>c.id===id); }
function terminalById(id){ return state.terminals.find(t=>t.id===id); }
function terminalName(id){ const t=terminalById(id); return t? t.name : 'Unknown terminal'; }
function userById(id){ return state.users.find(u=>u.id===id); }
function toast(msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div'); el.className='toast'; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3800);
}
function isSCTL(){ return state.role==='sctl'; }
function isCustoms(){ return state.role==='customs'; }
function isStaff(){ return state.role==='admin'; }
function myScopeMatches(c){ return isStaff() && c.terminalId===state.terminalId; } // SCTL can view every job but never change one
function isTerminalAdmin(){ return isStaff() && state.department==='Admin'; }
function canSeeFenBol(){ return isStaff() && FEN_BOL_DEPTS.includes(state.department); }
function canSeeFinance(){ return isStaff() && FINANCE_DEPTS.includes(state.department) && state.settings.features.finance; }

function canEditInvoiceNumber(c){ return myScopeMatches(c) && (['Accountant','DTI','Operations','Admin'].includes(state.department)); }
function canEditExitNumber(c){ return myScopeMatches(c) && (['Operations','Admin'].includes(state.department)); }

async function saveTransporter(id){
  const c = byId(id);
  const name = document.getElementById('transporter-name').value.trim();
  const phone = document.getElementById('transporter-phone').value.trim();
  const vehicleNumber = document.getElementById('transporter-vehicle').value.trim();
  const driverIdNumber = document.getElementById('transporter-id').value.trim();
  if(!name){ toast('Transporter / driver name is required.'); return; }
  const prev = c.transporter;
  const isHandover = prev && (prev.name!==name || (prev.phone||'')!==phone);
  if(isHandover){
    c.transportHistory = c.transportHistory || [];
    c.transportHistory.push({ name:prev.name, phone:prev.phone, vehicleNumber:prev.vehicleNumber, driverIdNumber:prev.driverIdNumber,
      by: state.person, handoverDate: new Date().toISOString() });
  }
  c.transporter = { name, phone: phone||null, vehicleNumber: vehicleNumber||null, driverIdNumber: driverIdNumber||null, by: state.person, date: new Date().toISOString() };
  if(!(await saveContainers(state.containers))) return;
  await pushLog(`${isHandover?'Transporter handover recorded':'Transporter recorded'} for ${c.containerNumber} by ${state.person}: ${name}`, 'Documentation', c.terminalId);
  toast(isHandover?'Handover recorded.':'Transporter / driver saved.');
  openContainer(id);
}
function checkMasterHold(){ if(state.settings.masterHold && !isSCTL()){ toast('Master Hold is active — SCTL has frozen this action platform-wide.'); return true; } return false; }
function ownerAgentLabel(c){
  const parts = [];
  if(c.owner) parts.push('Importer: '+c.owner);
  if(c.agent) parts.push('Agent: '+c.agent);
  return parts.join(' · ') || 'Unlinked job';
}
function visibleContainers(){
  if(isSCTL() || isCustoms()) return state.containers;
  if(isStaff()) return state.containers.filter(c=>c.terminalId===state.terminalId);
  if(state.role==='importer') return state.containers.filter(c=>c.owner===state.person);
  if(state.role==='agent') return state.containers.filter(c=>c.agent===state.person);
  return [];
}
function activeAlertCount(list){ return list.reduce((n,c)=>n+(c.alerts||[]).filter(a=>a.status==='active').length,0); }
function daysBetween(iso){ if(!iso) return null; return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function uniqueNames(list, key){ return [...new Set(list.map(c=>c[key]))].filter(Boolean); }
function genUniqueId(name){
  const letters = (name.replace(/[^A-Za-z\s]/g,'').split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,3)) || 'CTK';
  return `${letters}-${Math.floor(1000+Math.random()*9000)}`;
}
function stageGroup(c){ return c.stageIdx>=13 ? 'delivered' : (c.stageIdx>=9 ? 'terminal' : 'cpc'); }

function normalizeContainer(c){
  const merged = Object.assign({
    invoices:[], deliveryLocation:null, sealNumber:null, sealNumberDelivery:null, sealMismatch:false,
    placementInstruction:null, placementActual:null, progressNotes:[], transferLetterNumber:null,
    invoiceNumber:null, exitNumber:null, loadingDateTime:null, transportHandover:null, duplicateFlag:null,
    transporter:null, transportHistory:[], alerts:[], steppedDown:{status:false}, documents:[], history:[]
  }, c, {
    financial: Object.assign({
      processingCharge:0, mptRating:0, shippingRating:0, terminalCharges:0, clearingExpenses:0, transportation:0,
      manifestExpenses:0, paarExpenses:0, customsDuties:0, dutyStatus:'pending',
      dutyPaymentRef:null, dutyPaymentDate:null, otherExpenses:[], sonRemitaAmount:0, sonRemitaRef:null
    }, c.financial||{})
  });
  return merged;
}
function computeDuplicateFlags(){ /* the server works this out across every terminal and sends the flag with each job — this terminal can no longer see the other terminals' jobs */ }
function financialTotalOf(c, extra){
  extra = extra||0;
  const other = (c.financial.otherExpenses||[]).reduce((s,o)=>s+(Number(o.amount)||0),0);
  return c.financial.processingCharge + c.financial.mptRating + c.financial.shippingRating + c.financial.terminalCharges + c.financial.clearingExpenses +
    c.financial.transportation + c.financial.manifestExpenses + c.financial.paarExpenses + c.financial.customsDuties + c.financial.sonRemitaAmount + other + extra;
}

document.addEventListener('submit', async function(e){
  if(e.target && e.target.id==='signin-form'){
    e.preventDefault();
    showBusy('Signing you in…');
    const role = document.getElementById('s-role').value;
    const login = document.getElementById('s-login').value.trim().toLowerCase();
    const password = document.getElementById('s-password').value;
    let resp;
    try{
      resp = await apiFetch('/api/auth/login', {method:'POST', body: JSON.stringify({email: login, password: password})});
    }catch(err){
      state.authError = (err.status===401) ? 'No matching account. Check the role, email or username, and password.' : (err.message||'Could not reach the server.');
      renderAuthCard(); return;
    }
    setAuthToken(resp.token);
    let users;
    const fb0=window.__storageFailures||0; try{ users = await loadUsers(); if((window.__storageFailures||0)!==fb0) throw new Error('read failed'); }catch(e){ state.authError='Signed in, but could not load account details. Try again.'; setAuthToken(''); renderAuthCard(); return; }
    const u = users.find(x=>x.id===resp.userId);
    if(!u || u.role!==role){ state.authError='No matching account. Check the role, email or username, and password.'; setAuthToken(''); renderAuthCard(); return; }
    if(u.status==='pending_verification'){ state.authError='This account is awaiting verification. It will be approved by SCTL (new terminal) or your terminal Admin (existing terminal).'; setAuthToken(''); renderAuthCard(); return; }
    if(u.status==='suspended'){ state.authError='This account has been suspended. Contact your Admin.'; setAuthToken(''); renderAuthCard(); return; }
    if(u.status==='deactivated'){ state.authError='This account has been deactivated.'; setAuthToken(''); renderAuthCard(); return; }
    state.users = users;
    await finishLogin(u.id);
  }
  if(e.target && e.target.id==='server-setup-form'){
    e.preventDefault();
    const url = document.getElementById('setup-url').value.trim();
    if(!url){ return; }
    setApiBase(url);
    state.authError='';
    await tryBootstrapServer();
    await bootStatic();
    setAuthView('welcome');
  }
  if(e.target && e.target.id==='register-form'){
    e.preventDefault();
    const name = document.getElementById('r-name').value.trim();
    const email = document.getElementById('r-email').value.trim();
    const phone = document.getElementById('r-phone').value.trim();
    const password = document.getElementById('r-password').value;
    const password2 = document.getElementById('r-password2').value;
    const role = document.getElementById('r-role').value;
    const org = document.getElementById('r-org').value.trim() || (role==='admin' ? 'Bonded Terminal Staff' : (role==='customs' ? 'Nigeria Customs Service' : 'Independent'));
    const department = role==='admin' ? document.getElementById('r-dept').value : null;
    // Keep what was typed so a validation message doesn't wipe the whole form.
    state.regDraft = {name, email, phone, org, role, department,
      terminalSel: (document.getElementById('r-terminal')||{}).value,
      newTerminalName: (document.getElementById('r-terminal-name')||{}).value||'',
      newTerminalAddress: (document.getElementById('r-terminal-address')||{}).value||''};
    if(!name || !email){ state.authError='Full name and email are required.'; renderAuthCard(); return; }
    if(!/^0\d{10}$/.test(phone)){ state.authError='Enter a valid 11-digit phone number starting with 0.'; renderAuthCard(); return; }
    if(password.length<6){ state.authError='Password must be at least 6 characters.'; renderAuthCard(); return; }
    if(password!==password2){ state.authError='Passwords do not match.'; renderAuthCard(); return; }
    let terminalId = null, newTerminal = null;
    if(role!=='customs'){
      const tSel = document.getElementById('r-terminal').value;
      if(tSel==='__new__'){
        const tName = document.getElementById('r-terminal-name').value.trim();
        const tAddr = document.getElementById('r-terminal-address').value.trim();
        if(!tName || !tAddr){ state.authError='Provide the new terminal name and address.'; renderAuthCard(); return; }
        newTerminal = {name:tName, address:tAddr};
      } else terminalId = tSel;
    }
    state.regDraft = {name, email, phone, password, org, role, department, terminalId, newTerminal};
    state.otp = null; state.otpChannel = null;
    setAuthView('otp');
  }
});

async function submitIdVerification(){
  showBusy('Submitting your details…');
  const idType = document.getElementById('id-type').value;
  const fileInput = document.getElementById('id-file');
  const file = fileInput && fileInput.files && fileInput.files[0];
  if(!file){ state.authError='Please upload a photo of your ID before continuing.'; renderAuthCard(); return; }
  let idImage = null;
  try{
    idImage = await new Promise((res)=>{
      const reader = new FileReader();
      reader.onload = ()=>res(reader.result);
      reader.onerror = ()=>res(null);
      reader.readAsDataURL(file);
    });
  }catch(e){}
  const d = state.regDraft;
  const newId = 'u'+Date.now();
  const isNewTerminalAdmin = !!d.newTerminal;
  const newTerminalId = isNewTerminalAdmin ? 't'+Date.now() : null;
  const terminalId = isNewTerminalAdmin ? newTerminalId : d.terminalId;
  if(isNewTerminalAdmin) d.newTerminal.terminalId = newTerminalId;
  const user = {
    id:newId, name:d.name, login:d.email, phone:d.phone, org:d.org,
    role:d.role, department: d.role==='admin' ? (isNewTerminalAdmin?'Admin':d.department) : null,
    terminalId, status:'pending_verification', uniqueId:genUniqueId(d.name),
    stationedAt: STATIONS[0], profilePic:null, corporateRegNumber:null,
    idType, idImage, idFileName:file.name, isNewTerminalAdmin,
    verifiedBy:null, verifiedDate:null
  };
  // The server saves the password, the pending profile and (for a new bonded
  // terminal) the pending terminal together, or not at all.
  try{
    await apiFetch('/api/auth/register', {method:'POST', body: JSON.stringify({
      id:newId, email:d.email, password:d.password, profile:user,
      newTerminal: isNewTerminalAdmin ? {id:newTerminalId, name:d.newTerminal.name, address:d.newTerminal.address} : null
    })});
  }catch(err){
    state.authError = (err && err.status===409) ? 'That email is already registered. Try signing in.' : (err.message||'Could not reach the server.');
    renderAuthCard(); return;
  }
  toast('Submitted for verification.');
  d.newTerminal_ = isNewTerminalAdmin;
  state.regDraft.newTerminal = isNewTerminalAdmin ? state.regDraft.newTerminal : null;
  setAuthView('pending');
}
async function finishLogin(userId){
  const u = state.users.find(x=>x.id===userId);
  if(!u) return;
  state.role = u.role; state.person = u.name; state.userId = u.id; state.department = u.department; state.terminalId = u.terminalId;
  state.activeTab='dashboard';
  const [containers, log, referrals, messages] = await Promise.all([loadContainers(), loadLog(), loadReferrals(), loadMessages()]);
  state.containers = containers;
  computeDuplicateFlags();
  state.log = log; state.referrals = referrals; state.messages = messages;
  renderApp();
  startLiveSync();
}
function logout(){

function permissionsFor(u){
  if(u.role==='sctl') return {'Add or remove bonded terminals':true,'See every job across every terminal':true,'Approve new terminal requests':true,'Toggle platform Master Hold':true,'Everything a Terminal Admin can do':true};
  if(u.role==='customs') return {'View transire movement at the mother port':true,'Search any container or Bill of Lading':true,'Search and browse bonded terminals':true,'Comment with bonded terminal staff':true,'Advance or edit a container':false};
  if(u.role==='importer') return {'View own containers':true,'Fill delivery location':true,'Submit a referral':true,'Advance a container stage':false};
  if(u.role==='agent') return {'View client containers':true,'Fill delivery location':true,'Submit a referral':true,'Advance a container stage':false};
  const dept = u.department;
  return {
    'Create First Entry Note':FEN_BOL_DEPTS.includes(dept),
    'Complete Book of Life assessment':FEN_BOL_DEPTS.includes(dept),
    'Advance container stages':dept==='Admin' || (DEFAULT_DEPT_STAGE_ACCESS[dept]||[]).length>0,
    'Edit financial breakdown / invoices':FINANCE_DEPTS.includes(dept),
    'Approve or reject invoices':dept==='Admin',
    'Manage staff accounts':dept==='Admin',
    'Approve new user verification':dept==='Admin',
    'Toggle Master Hold for this terminal':false
  };
}
async function saveProfile(){
  const u = userById(state.profileTargetId);
  const canEditAll = isSCTL() || isTerminalAdmin();
  if(canEditAll){ u.name = document.getElementById('p-name').value.trim() || u.name; }
  u.login = document.getElementById('p-login').value.trim() || u.login;
  u.phone = document.getElementById('p-phone').value.trim() || u.phone;
  const orgEl = document.getElementById('p-org'); if(orgEl) u.org = orgEl.value.trim() || u.org;
  u.stationedAt = document.getElementById('p-station').value;
  const picInput = document.getElementById('p-pic');
  const file = picInput && picInput.files && picInput.files[0];
  if(file){
    try{ u.profilePic = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(null); r.readAsDataURL(file); }); }catch(e){}
  }

  toast('Profile updated.');
  closeModal();

/* ========================= JOB LIST RENDERING (shared) ========================= */
function jobListHTML(list, opts){
  opts = opts || {};
  if(list.length===0) return `<div class="empty-state"><div class="glyph">// //</div>No containers to show.</div>`;
  const sorted = [...list].sort((a,b)=> activeAlertCount([b]) - activeAlertCount([a]) || a.stageIdx-b.stageIdx);
  return sorted.map(c=>{
    const alerts = c.alerts.filter(a=>a.status==='active');
    const stage = STAGES[c.stageIdx];
    const pillClass = c.stageIdx>=13 ? 'done' : (alerts.length? 'wait':'ok');
    let colText;
    if(opts.showTerminal) colText = terminalName(c.terminalId);
    else if(state.role==='importer') colText = c.agent ? c.agent : 'Direct import — no agent';
    else if(state.role==='agent') colText = c.owner ? c.owner : 'Agent-sourced — no importer';
    else colText = ownerAgentLabel(c);
    let statusHtml = alerts.length? `<span class="flag">${alerts[0].type}</span>` : `<span class="pill ${pillClass}">${c.stageIdx>=13?'Delivered':(c.stageIdx>=9?'At terminal':'In CPC')}</span>`;
    if((state.role==='importer'||state.role==='agent') && docsNeedingFix(c).length) statusHtml = '<span class="flag">Document rejected</span>';
    if(c.steppedDown.status) statusHtml = `<span class="pill stepped">Stepped down</span>`;
    const dupBadge = c.duplicateFlag ? `<span class="flag" style="margin-left:4px;" title="Also registered by ${c.duplicateFlag.terminalNames.join(', ')}">DUPLICATE</span>` : '';
    return `<div class="job-row" data-cnum="${c.containerNumber.toLowerCase()}" data-bol="${c.billOfLading.toLowerCase()}" data-owner="${c.owner||''}" data-agent="${c.agent||''}" data-stagegroup="${c.steppedDown.status?'stepped':stageGroup(c)}" onclick="openContainer('${c.id}')">
      <div class="cnum">${c.containerNumber}${dupBadge}</div>
      <div><div>${c.item}</div><div class="bol">${c.billOfLading} · ${c.size}${!c.bolComplete?' · <span style=\'color:#8F6F22\'>DTI assessment pending</span>':''}${c.transporter&&c.transporter.name?` · <span class="mono" style="font-size:10px;">Transporter: ${c.transporter.name}</span>`:''}</div></div>
      <div class="stage-lbl">${stage.label}</div>
      <div class="owner">${colText}</div>
      <div>${statusHtml}</div>
    </div>`;
  }).join('');
}
function filterJobRows(q){
  q = (q||'').toLowerCase();
  document.querySelectorAll('#job-list .job-row').forEach(r=>{
    const match = r.dataset.cnum.includes(q) || r.dataset.bol.includes(q);
    r.style.display = match ? 'grid' : 'none';
  });
}
function applyAdminFilters(){
  const status = document.getElementById('f-status') ? document.getElementById('f-status').value : 'all';
  const owner = document.getElementById('f-owner-filter') ? document.getElementById('f-owner-filter').value : 'all';
  const agent = document.getElementById('f-agent-filter') ? document.getElementById('f-agent-filter').value : 'all';
  const q = document.getElementById('job-search') ? document.getElementById('job-search').value.toLowerCase() : '';
  document.querySelectorAll('#job-list .job-row').forEach(r=>{
    let show = true;
    if(status!=='all' && r.dataset.stagegroup!==status) show=false;
    if(owner!=='all' && r.dataset.owner!==owner) show=false;
    if(agent!=='all' && r.dataset.agent!==agent) show=false;
    if(q && !(r.dataset.cnum.includes(q) || r.dataset.bol.includes(q))) show=false;
    r.style.display = show ? 'grid' : 'none';
  });
}

function computePendingTasks(){
  const list = state.containers.filter(c=>c.terminalId===state.terminalId && !c.steppedDown.status);
  const tasks = [];
  const dept = state.department;
  if(dept==='Documentation' || dept==='Admin'){
    list.filter(c=>!c.transferLetterNumber).forEach(c=>tasks.push({text:`${c.containerNumber} is missing a transfer letter number`, id:c.id}));
  }
  if(dept==='DTI' || dept==='Admin'){
    list.filter(c=>!c.bolComplete).forEach(c=>tasks.push({text:`${c.containerNumber} is awaiting DTI assessment`, id:c.id}));
  }
  if(dept==='Operations' || dept==='Admin'){
    list.filter(c=>c.stageIdx>=10 && !c.sealNumber).forEach(c=>tasks.push({text:`${c.containerNumber} passed examination but has no seal number recorded`, id:c.id}));
    list.filter(c=>c.stageIdx>=11 && !c.exitNumber).forEach(c=>tasks.push({text:`${c.containerNumber} was released but has no exit number recorded`, id:c.id}));
    list.filter(c=>c.stageIdx>=9 && !c.placementActual).forEach(c=>tasks.push({text:`${c.containerNumber} is at the terminal but has no recorded placement`, id:c.id}));
  }
  if(dept==='Transport' || dept==='Admin'){
    list.filter(c=>c.stageIdx===13 && !c.deliveryLocation).forEach(c=>tasks.push({text:`${c.containerNumber} is out for delivery but has no delivery location on file`, id:c.id}));
    list.filter(c=>c.stageIdx>=12 && !c.loadingDateTime).forEach(c=>tasks.push({text:`${c.containerNumber} needs a loading date/time recorded`, id:c.id}));
  }
  if(dept==='Accountant' || dept==='Admin'){
    list.filter(c=>c.financial.dutyStatus==='pending' && c.stageIdx>=9).forEach(c=>tasks.push({text:`${c.containerNumber} at the terminal still has duty pending`, id:c.id}));
    list.forEach(c=>(c.invoices||[]).filter(i=>i.status==='pending').forEach(()=>tasks.push({text:`${c.containerNumber} has an invoice awaiting Admin approval`, id:c.id})));
  }
  if(dept==='Admin'){
    list.filter(c=>c.duplicateFlag).forEach(c=>tasks.push({text:`${c.containerNumber} is flagged as a duplicate registration — review with the other terminal`, id:c.id}));
  }
  return tasks;
}

async function submitFEN(e){
  e.preventDefault();
  if(checkMasterHold()) return;
  const cnum = document.getElementById('f-cnum').value.trim().toUpperCase();
  const bol = document.getElementById('f-bol').value.trim();
  const jobtype = document.getElementById('f-jobtype').value;
  const owner = jobtype==='importer' ? document.getElementById('f-owner').value : null;
  const agent = jobtype==='agent' ? document.getElementById('f-agent').value : null;
  if(!cnum || !bol){ toast('Container number and Bill of Lading are required.'); return; }
  if(jobtype==='importer' && !owner){ toast('Select an importer, or register one first.'); return; }
  if(jobtype==='agent' && !agent){ toast('Select a clearing agent, or register one first.'); return; }
  if(state.containers.some(c=>c.terminalId===state.terminalId && c.containerNumber===cnum)){ toast('That container number is already registered at your terminal.'); return; }
  const c = normalizeContainer({
    id:'c'+Date.now(), terminalId:state.terminalId, containerNumber:cnum, billOfLading:bol,
    size:document.getElementById('f-size').value,
    item:document.getElementById('f-item').value.trim() || 'Unspecified cargo',
    destination:document.getElementById('f-dest').value.trim() || 'Not specified',
    owner, agent, bolComplete:false, aNumber:null, cNumber:null, stageIdx:0,
    history:[{stage:0, t:new Date().toISOString(), user:state.person}],
    alerts:[], documents:[],
    financial:{processingCharge:Number(document.getElementById('f-processing').value)||0},
    detentionStart:null, steppedDown:{status:false,comment:'',by:null,date:null}, createdAt:new Date().toISOString()
  });
  state.containers.push(c);
  computeDuplicateFlags();
  if(!(await saveContainers(state.containers))) return;
  await pushLog(`New job registered: ${cnum} (FEN) by ${state.person}. DTI draft assessment required.`, 'DTI');
  await refreshFromStorage(); { const cc = byId(c.id); if(cc) c.duplicateFlag = cc.duplicateFlag; }
  if(c.duplicateFlag) await pushLog(`${cnum} flagged as a duplicate registration, also seen at ${c.duplicateFlag.terminalNames.join(', ')}.`, 'Admin');
  toast(`${cnum} registered in First Entry Note.${c.duplicateFlag?' Flagged as a duplicate registration.':''}`);
  renderTab();
}

/* ========================= PERFORMANCE REPORTS ========================= */
function reportsHTML(){
  const list = isSCTL() ? state.containers : state.containers.filter(c=>c.terminalId===state.terminalId);
  const delivered = list.filter(c=>c.stageIdx>=13 && !c.steppedDown.status);
  const avgTat = delivered.length ? Math.round(delivered.reduce((s,c)=>s+daysBetween(c.createdAt),0)/delivered.length) : 0;

  const transireDays = list.filter(c=>c.transireSubmittedDate).map(c=>daysBetween(c.createdAt) - daysBetween(c.transireSubmittedDate));
  const avgTransire = transireDays.length ? Math.round(transireDays.reduce((a,b)=>a+b,0)/transireDays.length) : null;
  const deliveryDays = delivered.filter(c=>c.deliveredDate).map(c=>Math.max(0, Math.floor((new Date(c.deliveredDate)-new Date(c.createdAt))/86400000)));
  const avgDelivery = deliveryDays.length ? Math.round(deliveryDays.reduce((a,b)=>a+b,0)/deliveryDays.length) : null;

  const alertCounts = {};
  list.forEach(c=>c.alerts.forEach(a=>{ alertCounts[a.type]=(alertCounts[a.type]||0)+1; }));
  const maxAlert = Math.max(1, ...Object.values(alertCounts));

  const stageCounts = {};
  list.forEach(c=>{ if(c.stageIdx<13 && !c.steppedDown.status){ const k=STAGES[c.stageIdx].code; stageCounts[k]=(stageCounts[k]||0)+1; } });
  const maxStage = Math.max(1, ...Object.values(stageCounts), 0);

  const agentCounts = {};
  list.forEach(c=>{ const key = c.agent || 'No agent (direct import)'; agentCounts[key]=(agentCounts[key]||0)+1; });
  const maxAgent = Math.max(1, ...Object.values(agentCounts), 0);

  return `
    <div class="topbar"><div><h1>Performance Reports</h1><div class="desc">${isSCTL()?'Platform-wide metrics across every bonded terminal.':'Terminal-wide metrics to spot bottlenecks and track turnaround.'}</div></div></div>
    <div class="metric-row">
      <div class="metric"><div class="num">${avgTat}d</div><div class="lbl">Avg. turnaround (delivered jobs)</div></div>
      <div class="metric"><div class="num">${avgTransire!==null?avgTransire+'d':'—'}</div><div class="lbl">Avg. days to submit transire</div></div>
      <div class="metric"><div class="num">${avgDelivery!==null?avgDelivery+'d':'—'}</div><div class="lbl">Avg. days to deliver to customer</div></div>
      <div class="metric"><div class="num">${list.filter(c=>c.steppedDown.status).length}</div><div class="lbl">Stepped down</div></div>
    </div>
    <div class="panel"><div class="panel-head"><h3>Bottleneck — jobs currently sitting per stage</h3></div>
      <div class="panel-body">
        ${Object.keys(stageCounts).length===0 ? '<div class="tag-line">No jobs in progress.</div>' :
          Object.entries(stageCounts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
          <div class="bar-row"><div class="bar-label"><span>${k}</span><span>${v}</span></div>
            <div class="bar-track"><div class="bar-fill amber" style="width:${(v/maxStage*100).toFixed(0)}%"></div></div></div>`).join('')}
      </div></div>
    <div class="panel"><div class="panel-head"><h3>Alerts by type</h3></div>
      <div class="panel-body">
        ${Object.keys(alertCounts).length===0 ? '<div class="tag-line">No alerts raised yet.</div>' :
          Object.entries(alertCounts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
          <div class="bar-row"><div class="bar-label"><span>${k}</span><span>${v}</span></div>
            <div class="bar-track"><div class="bar-fill rust" style="width:${(v/maxAlert*100).toFixed(0)}%"></div></div></div>`).join('')}
      </div></div>
    <div class="panel"><div class="panel-head"><h3>Jobs handled per agent</h3></div>
      <div class="panel-body">
        ${Object.keys(agentCounts).length===0 ? '<div class="tag-line">No jobs yet.</div>' :
          Object.entries(agentCounts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
          <div class="bar-row"><div class="bar-label"><span>${k}</span><span>${v}</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${(v/maxAgent*100).toFixed(0)}%"></div></div></div>`).join('')}
      </div></div>`;
}

async function adminAddStaff(){
  const name = document.getElementById('add-name').value.trim();
  const email = document.getElementById('add-email').value.trim();
  const dept = document.getElementById('add-dept').value;
  if(!name || !email){ toast('Name and email are required.'); return; }
  const temp = Math.random().toString(36).slice(2,8);
  const newId = 'u'+Date.now();
  try{
    await apiFetch('/api/auth/register', {method:'POST', body: JSON.stringify({id:newId, email, password:temp})});
  }catch(err){
    toast(err && err.status===409 ? 'That email is already registered.' : ('Could not create account: '+(err.message||'server error')));
    return;
  }
  const user = {id:newId, name, login:email, phone:'', org:terminalName(state.terminalId), role:'admin', department:dept, terminalId:state.terminalId, status:'active', uniqueId:genUniqueId(name), stationedAt:STATIONS[0]};
  state.users.push(user);
  if(!(await saveUsers(state.users))) return;
  await pushLog(`${name} added to staff (${dept}) by ${state.person}. Temp password: ${temp}`, null, state.terminalId);
  toast(`${name} added. Temp password: ${temp} (would be emailed in production).`);
  renderTab();
}
async function bulkImportCsv(){
  const raw = document.getElementById('csv-input').value.trim();
  if(!raw){ toast('Paste CSV rows first.'); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let added = 0, skipped = 0;
  for(const line of lines){
    const [name, email, phone, dept] = line.split(',').map(s=>(s||'').trim());
    if(!name || !email || !DEPARTMENTS.includes(dept)){ skipped++; continue; }
    const newId = 'u'+Date.now()+added;
    try{
      await apiFetch('/api/auth/register', {method:'POST', body: JSON.stringify({id:newId, email, password:Math.random().toString(36).slice(2,8)})});
    }catch(err){ skipped++; continue; }
    state.users.push({id:newId, name, login:email, phone:phone||'', org:terminalName(state.terminalId), role:'admin', department:dept, terminalId:state.terminalId, status:'active', uniqueId:genUniqueId(name), stationedAt:STATIONS[0]});
    added++;
  }
  if(!(await saveUsers(state.users))) return;
  await pushLog(`Bulk import by ${state.person}: ${added} added, ${skipped} skipped.`, null, state.terminalId);
  toast(`${added} staff added, ${skipped} skipped.`);
  renderTab();
}
async function saveDeptStageAccess(dept){
  const boxes = document.querySelectorAll(`input[data-dept="${dept}"]`);
  const arr = [];
  boxes.forEach(b=>{ if(b.checked) arr.push(Number(b.dataset.stage)); });
  state.settings.deptStageAccess = state.settings.deptStageAccess || {};
  state.settings.deptStageAccess[dept] = arr;
  await saveSettings();
  toast(`${dept} stage access saved.`);
}

  if(!(await saveContainers(state.containers))) return;
  await pushLog(`${c.containerNumber}: DTI assessment complete (A:${a} / C:${cc}) by ${state.person}`, 'Documentation', c.terminalId);
  toast(`${c.containerNumber} Book of Life numbers saved.`);

async function updateStage(id){
  if(checkMasterHold()) return;
  const c = byId(id);
  const idx = parseInt(document.getElementById('stage-select').value,10);
  if(idx === c.stageIdx){ toast('Already at that stage.'); return; }
  const allowed = allowedStagesFor(state.department);
  if(state.department!=='Admin' && !allowed.includes(idx)){ toast(`Your department (${state.department}) is not authorized to set this stage.`); return; }
  const forceEl = document.getElementById('force-advance');
  const force = forceEl && forceEl.checked;
  if(idx>=10 && !c.bolComplete && !force){ toast('Assessment (Book of Life) must be completed before examination can begin.'); return; }
  if(Math.abs(idx - c.stageIdx) > 1 && !force){
    if(!confirm('Stage progression looks out of sequence. Continue anyway?')) return;
  }
  const wasZero = c.stageIdx===0;
  c.stageIdx = idx;
  c.history.push({stage:idx, t:new Date().toISOString(), user: state.person});
  if(wasZero && idx>0 && !c.transireSubmittedDate) c.transireSubmittedDate = new Date().toISOString();
  if(idx===13 && !c.deliveredDate) c.deliveredDate = new Date().toISOString();
  if(idx===12 && !c.detentionStart) c.detentionStart = new Date().toISOString();
  if(!(await saveContainers(state.containers))) return;
  const dept = STAGE_DEPT[idx];
  await pushLog(`${c.containerNumber} moved to ${STAGES[idx].code} — ${STAGES[idx].label} at ${fmtDateTime(new Date().toISOString())}. Action now with ${dept}. (by ${state.person})`, dept, c.terminalId);
  if(idx===9) await pushLog(`${c.containerNumber} arrived at the terminal — schedule examination.`, 'Operations', c.terminalId);
  if(idx===11) await pushLog(`${c.containerNumber} released by customs — ready for delivery.`, 'Transport', c.terminalId);
  toast(`${c.containerNumber} updated to ${STAGES[idx].code}.`);
  openContainer(id); renderApp();
}

/* ---- Progress notes: replies, staff-only comments, notify the author ---- */
function newNoteId(){ return 'n'+Date.now()+Math.random().toString(16).slice(2,6); }
function canSeeStaffNotes(){ return (isStaff()||isSCTL()); }
function canAddNote(c){ return myScopeMatches(c); }
function progressNotesHTML(c){
  const all = (c.progressNotes||[]).map((n,i)=>Object.assign({_i:i},n)).filter(n=>!n.staffOnly || canSeeStaffNotes());
  if(!all.length) return '<div class="tag-line">No delay notes recorded.</div>';
  const isTop = n => !n.replyTo || !all.some(p=>p.id===n.replyTo);
  const row = (n, reply) => `<div class="history-row" style="${reply?'margin-left:26px;':''}"><div class="dot"></div><div style="flex:1;min-width:0;">
      <div class="t">${fmtDateTime(n.date)}${n.staffOnly?' <span class="flag">STAFF ONLY</span>':''}${reply?' · reply':''}</div>${jobEsc(n.text)}
      <div class="tag-line">— ${jobEsc(n.by)}${canAddNote(c)?` · <a href="#" onclick="startNoteReply('${c.id}',${n._i});return false;">Reply</a>`:''}</div>
      <div id="reply-box-${n._i}"></div></div></div>`;
  return all.filter(isTop).reverse().map(n=> row(n,false) + all.filter(r=>r.replyTo && r.replyTo===n.id).map(r=>row(r,true)).join('')).join('');
}
function startNoteReply(cid, i){
  const box = document.getElementById('reply-box-'+i); if(!box) return;
  state.editingJob = cid; // pause live refresh so the box is not wiped while typing
  box.innerHTML = `<textarea id="reply-text" rows="2" style="margin:6px 0;width:100%;" placeholder="Write your reply…"></textarea>
    <button class="btn small" onclick="sendNoteReply('${cid}',${i})">Send reply</button> <button class="btn small secondary" onclick="cancelEditJob('${cid}')">Cancel</button>`;
  const t = document.getElementById('reply-text'); if(t) t.focus();
}
async function sendNoteReply(cid, i){
  const c = byId(cid); const parent = c && c.progressNotes && c.progressNotes[i];
  const text = (document.getElementById('reply-text')||{value:''}).value.trim();
  if(!parent){ toast('That comment no longer exists.'); state.editingJob=null; openContainer(cid); return; }
  if(!text){ toast('Write a reply first.'); return; }
  if(!canAddNote(c)){ toast('You do not have permission to reply here.'); return; }
  if(!parent.id) parent.id = newNoteId();
  state.editingJob = null;
  c.progressNotes.push({id:newNoteId(), text, by:state.person, date:new Date().toISOString(), replyTo:parent.id, staffOnly: !!parent.staffOnly});
  if(!(await saveContainers(state.containers))) return;
  const author = state.users.find(u=>u.name===parent.by);
  const dept = author && author.department;
  if(dept && parent.by!==state.person){
    const msg = `${state.person} replied to your comment on ${c.containerNumber}: "${text.length>140?text.slice(0,140)+'…':text}"`;
    await pushLog(msg, dept, c.terminalId);
  } else {
    await pushLog(`Reply on ${c.containerNumber} by ${state.person}.`, null, c.terminalId);
  }
  toast('Reply sent.');
  openContainer(cid);
}

  if(!text){ toast('Enter a comment explaining the delay first.'); return; }

  const so = document.getElementById('progress-staffonly');
  c.progressNotes.push({id:newNoteId(), text, by:state.person, date:new Date().toISOString(), staffOnly: !!(so && so.checked)});
