$kind: http-request
url: "{{baseUrl}}/api/storage/messages"
method: PUT
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "value": "[{\"id\":\"m1\",\"from\":\"Ade Admin\",\"channel\":\"internal:t1\",\"text\":\"Truck booked for Monday\"}]"
    }
scripts:
  - type: afterResponse
    code: pm.test("status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 10000
