$kind: http-request
url: "{{baseUrl}}/api/storage/platform-settings"
method: PUT
headers:
  Authorization: Bearer {{tokenImp}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "value": "{\"brand\":\"Hacked\"}"
    }
scripts:
  - type: afterResponse
    code: pm.test("status is 403", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 5000
