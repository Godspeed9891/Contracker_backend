$kind: http-request
name: "Not signed in: change a user"
url: "{{baseUrl}}/api/storage/users"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "value": "[{\"id\":\"u-imp\",\"name\":\"Imp Ortr\",\"login\":\"importer@test.com\",\"role\":\"sctl\",\"terminalId\":\"t1\",\"status\":\"active\"}]"
    }
scripts:
  - type: afterResponse
    code: pm.test("status is 401", function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 4000
