$kind: http-request
url: "{{baseUrl}}/api/storage/users"
method: PUT
headers:
  Authorization: Bearer {{tokenImp}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "value": "[{\"id\":\"u-imp\",\"name\":\"Imp Ortr\",\"login\":\"importer@test.com\",\"role\":\"importer\",\"terminalId\":\"t2\",\"status\":\"active\"}]",
      "changed": [
        "u-imp"
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test("status is 403", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 3000
