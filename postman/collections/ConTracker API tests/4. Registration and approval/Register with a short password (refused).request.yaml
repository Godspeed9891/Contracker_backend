$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "u-y",
      "email": "y@test.com",
      "password": "123",
      "profile": {
        "name": "Y",
        "role": "importer",
        "terminalId": "t1"
      }
    }
scripts:
  - type: afterResponse
    code: pm.test("status is 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 4000
