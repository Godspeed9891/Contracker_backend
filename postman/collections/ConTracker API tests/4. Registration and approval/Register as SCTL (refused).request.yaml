$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "u-x",
      "email": "x@test.com",
      "password": "password123",
      "profile": {
        "name": "X",
        "role": "sctl"
      }
    }
scripts:
  - type: afterResponse
    code: pm.test("status is 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 3000
