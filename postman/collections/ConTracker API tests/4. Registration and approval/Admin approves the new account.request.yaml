$kind: http-request
url: "{{baseUrl}}/api/storage/users"
method: PUT
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "value": "[{\"id\":\"u-new\",\"name\":\"New Person\",\"login\":\"new@test.com\",\"role\":\"importer\",\"terminalId\":\"t1\",\"status\":\"active\"}]",
      "changed": [
        "u-new"
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test("status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 6000
