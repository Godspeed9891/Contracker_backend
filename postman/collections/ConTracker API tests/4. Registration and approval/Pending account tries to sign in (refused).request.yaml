$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "new@test.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: pm.test("status is 403", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 5000
