$kind: http-request
url: "{{baseUrl}}/api/auth/set-password"
method: POST
headers:
  Authorization: Bearer {{tokenImp}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@test.com",
      "newPassword": "hacked123"
    }
scripts:
  - type: afterResponse
    code: pm.test("status is 403", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 4000
