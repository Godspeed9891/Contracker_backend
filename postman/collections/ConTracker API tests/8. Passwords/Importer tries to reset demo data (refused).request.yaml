$kind: http-request
url: "{{baseUrl}}/api/auth/reset-seed-credentials"
method: POST
headers:
  Authorization: Bearer {{tokenImp}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "accounts": []
    }
scripts:
  - type: afterResponse
    code: pm.test("status is 403", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 5000
