$kind: http-request
url: "{{baseUrl}}/api/auth/set-password"
method: POST
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "docs@test.com",
      "newPassword": "docs-new-789"
    }
scripts:
  - type: afterResponse
    code: pm.test("status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
