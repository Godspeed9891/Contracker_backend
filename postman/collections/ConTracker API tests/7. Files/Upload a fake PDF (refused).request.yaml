$kind: http-request
url: "{{baseUrl}}/api/files?name=fake.pdf"
method: POST
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/pdf
queryParams:
  name: fake.pdf
body:
  type: text
  content: this is not a pdf
scripts:
  - type: afterResponse
    code: pm.test("status is 400", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 3000
